<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>異常管制局探員檔案</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-6">
    <div class="max-w-4xl mx-auto space-y-6">
        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 shadow-lg">
            <h1 class="text-2xl font-bold text-cyan-400">異常管制局探員檔案</h1>
        </div>
        <div id="playerContainer" class="space-y-6">
            <div class="text-center py-20 text-slate-500">正在連接資料庫並讀取角色資料...</div>
        </div>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { doc, onSnapshot, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const container = document.getElementById('playerContainer');
        const urlParams = new URLSearchParams(window.location.search);
        const playerId = urlParams.get('id') || 'player01';  

        try {
            const docRef = doc(db, "players", playerId);
            
            onSnapshot(docRef, (docSnap) => {
                if (!docSnap.exists()) {
                    // 【已修正】補上正確的變數括號 ${playerId}
                    container.innerHTML = `<div class="text-center py-20 text-red-400">找不到此角色 ID (<b>${playerId}</b>) 的資料。<br>請確認 Firebase 的 "players" 集合中是否有建立這個 ID 的文件。</div>`;
                    return;
                }

                const p = docSnap.data();
                const avatarUrl = p.頭像 || p.avatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80';
                const primaryName = p.代號 || p.姓名 || '未命名';
                const subName = p.代號 ? `(姓名: ${p.姓名 || '-'})` : '';

                container.innerHTML = `
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-2xl space-y-6">
                        <div class="flex flex-col md:flex-row items-center gap-6 border-b border-slate-800 pb-6 text-center md:text-left">
                            <img src="${avatarUrl}" alt="頭像" onerror="this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80'" class="w-32 h-32 rounded-full object-cover border-4 border-cyan-400 shadow-xl">
                            <div class="space-y-1.5 flex-1">
                                <div class="text-3xl font-bold text-cyan-300">${primaryName} <span class="text-sm font-normal text-slate-400">${subName}</span></div>
                                <div class="text-sm text-slate-300 flex flex-wrap justify-center md:justify-start gap-3 mt-2">
                                    <span class="bg-slate-800 px-2.5 py-1 rounded border border-slate-700">性別: ${p.性別 || '-'}</span>
                                    <span class="bg-slate-800 px-2.5 py-1 rounded border border-slate-700">年齡: ${p.年齡 || '-'}</span>
                                    <span class="bg-slate-800 px-2.5 py-1 rounded border border-slate-700">種族: ${p.種族 || '-'}</span>
                                    <span class="bg-slate-800 px-2.5 py-1 rounded border border-slate-700">職業: ${p.職業 || '-'}</span>
                                </div>
                            </div>
                            <div class="bg-slate-800/80 px-4 py-2 rounded-xl border border-slate-700 text-center">
                                <div class="text-xs text-slate-400">當前資產</div>
                                <div class="text-xl font-bold text-yellow-400">${p.資產 ?? 0} 元</div>
                            </div>
                        </div>

                        <!-- 屬性區 -->
                        <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
                            <div class="bg-slate-800/50 p-3 rounded-xl border border-slate-700/50 space-y-2 text-center">
                                <div class="text-xs text-slate-400">生命值</div>
                                <div class="text-2xl font-bold text-red-400">${p.生命值 ?? 0}</div>
                                <div class="flex justify-center gap-1">
                                    <button onclick="window.adjustValue('${playerId}', '生命值', -1, ${p.生命值 ?? 0})" class="bg-slate-700 hover:bg-slate-600 px-2 py-0.5 rounded text-xs">-1</button>
                                    <button onclick="window.adjustValue('${playerId}', '生命值', 1, ${p.生命值 ?? 0})" class="bg-slate-700 hover:bg-slate-600 px-2 py-0.5 rounded text-xs">+1</button>
                                </div>
                            </div>
                            <div class="bg-slate-800/50 p-3 rounded-xl border border-slate-700/50 space-y-2 text-center">
                                <div class="text-xs text-slate-400">修為</div>
                                <div class="text-2xl font-bold text-cyan-400">${p.修為 ?? 0}</div>
                                <div class="flex justify-center gap-1">
                                    <button onclick="window.adjustValue('${playerId}', '修為', -1, ${p.修為 ?? 0})" class="bg-slate-700 hover:bg-slate-600 px-2 py-0.5 rounded text-xs">-1</button>
                                    <button onclick="window.adjustValue('${playerId}', '修為', 1, ${p.修為 ?? 0})" class="bg-slate-700 hover:bg-slate-600 px-2 py-0.5 rounded text-xs">+1</button>
                                </div>
                            </div>
                            <div class="bg-slate-800/50 p-3 rounded-xl border border-slate-700/50 space-y-2 text-center">
                                <div class="text-xs text-slate-400">速度</div>
                                <div class="text-2xl font-bold text-emerald-400">${p.速度 ?? 0}</div>
                                <div class="flex justify-center gap-1">
                                    <button onclick="window.adjustValue('${playerId}', '速度', -1, ${p.速度 ?? 0})" class="bg-slate-700 hover:bg-slate-600 px-2 py-0.5 rounded text-xs">-1</button>
                                    <button onclick="window.adjustValue('${playerId}', '速度', 1, ${p.速度 ?? 0})" class="bg-slate-700 hover:bg-slate-600 px-2 py-0.5 rounded text-xs">+1</button>
                                </div>
                            </div>
                            <div class="bg-slate-800/50 p-3 rounded-xl border border-slate-700/50 space-y-2 text-center">
                                <div class="text-xs text-slate-400">攻擊</div>
                                <div class="text-2xl font-bold text-orange-400">${p.攻擊 ?? 0}</div>
                                <div class="flex justify-center gap-1">
                                    <button onclick="window.adjustValue('${playerId}', '攻擊', -1, ${p.攻擊 ?? 0})" class="bg-slate-700 hover:bg-slate-600 px-2 py-0.5 rounded text-xs">-1</button>
                                    <button onclick="window.adjustValue('${playerId}', '攻擊', 1, ${p.攻擊 ?? 0})" class="bg-slate-700 hover:bg-slate-600 px-2 py-0.5 rounded text-xs">+1</button>
                                </div>
                            </div>
                            <div class="bg-slate-800/50 p-3 rounded-xl border border-slate-700/50 space-y-2 text-center">
                                <div class="text-xs text-slate-400">防禦</div>
                                <div class="text-2xl font-bold text-blue-400">${p.防禦 ?? 0}</div>
                                <div class="flex justify-center gap-1">
                                    <button onclick="window.adjustValue('${playerId}', '防禦', -1, ${p.防禦 ?? 0})" class="bg-slate-700 hover:bg-slate-600 px-2 py-0.5 rounded text-xs">-1</button>
                                    <button onclick="window.adjustValue('${playerId}', '防禦', 1, ${p.防禦 ?? 0})" class="bg-slate-700 hover:bg-slate-600 px-2 py-0.5 rounded text-xs">+1</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }, (error) => {
                // 【已修正】console.err 改為 console.error
                console.error("監聽失敗：", error);
                container.innerHTML = `<div class="text-center py-20 text-red-400">Firebase 連線或權限錯誤：${error.message}</div>`;
            });

        } catch (err) {
            console.error(err);
            container.innerHTML = `<div class="text-center py-20 text-red-400">初始化發生錯誤：${err.message}</div>`;
        }

        window.adjustValue = async function(playerId, field, delta, currentVal) {
            const newVal = Math.max(0, (currentVal ?? 0) + delta);
            await updateDoc(doc(db, "players", playerId), { [field]: newVal });
        };
    </script>
</body>
</html>
