<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRPG 玩家狀態面板</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #e0e0e0; padding: 20px; max-width: 700px; margin: auto; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .stat-box { background: #2d2d2d; padding: 10px; border-radius: 6px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #bb86fc; font-size: 0.9rem; }
        input { width: 100%; padding: 8px; background: #3d3d3d; border: 1px solid #555; color: #fff; border-radius: 4px; box-sizing: border-box; }
        button { background: #bb86fc; color: #121212; border: none; padding: 8px 12px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 5px; }
        button:hover { background: #9965f4; }
        .btn-danger { background: #cf6679; color: #fff; }
        .btn-danger:hover { background: #b04658; }
        img.avatar { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; float: right; border: 2px solid #bb86fc; }
        h2 { margin-top: 0; }
        hr { border: 0; border-top: 1px solid #444; margin: 15px 0; }
    </style>
</head>
<body>

    <div class="card">
        <img id="player-avatar" class="avatar" src="" alt="頭像" onerror="this.style.display='none'">
        <h2 id="player-title">載入中...</h2>
        <p id="player-info" style="color: #aaa; font-size: 0.9rem;"></p>
        <div id="status-tip" style="color: #38bdf8; font-size: 0.85rem; margin-bottom: 10px;"></div>
    </div>

    <!-- 戰鬥屬性 -->
    <div class="card">
        <h3>⚔️ 戰鬥與狀態</h3>
        <div class="grid" id="stats-grid"></div>
    </div>

    <!-- 常用道具 -->
    <div class="card">
        <h3>🎒 常用道具 (點擊消耗)</h3>
        <div class="grid" id="items-grid"></div>
        <hr>
        <h4>➕ 新增自訂道具</h4>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="custom-item-name" placeholder="輸入道具名稱">
            <button id="add-custom-item-btn">新增</button>
        </div>
        <div id="custom-items-list" style="margin-top: 10px;"></div>
    </div>

    <div class="card">
        <button id="save-btn" style="width: 100%; padding: 12px; font-size: 1rem;">儲存所有變更</button>
    </div>

    <script type="module">
        import { db, doc, onSnapshot, updateDoc } from "./firebase-config.js";

        const urlParams = new URLSearchParams(window.location.search);
        const playerId = urlParams.get('id') || 'player01';
        document.getElementById("status-tip").innerText = `目前連結身分代號: ${playerId}`;

        const docRef = doc(db, "players", playerId);
        let localData = {};

        onSnapshot(docRef, (docSnap) => {
            if (docSnap.exists()) {
                localData = docSnap.data();
                renderPage(localData);
            } else {
                document.getElementById("player-title").innerText = "找不到該玩家資料";
            }
        });

        function renderPage(data) {
            // 基本資訊
            document.getElementById("player-avatar").src = data.頭像 || "";
            document.getElementById("player-title").innerText = `${data.姓名 || '未命名'} (${data.代號 || '無代號'})`;
            document.getElementById("player-info").innerText = `種族: ${data.種族 || '-'} | 職業: ${data.職業 || '-'} | 性別: ${data.性別 || '-'} | 年齡: ${data.年齡 || '-'} | 資產: 💰 ${data.資產 || 0}`;

            // 戰鬥屬性 (生命值、修為、速度、攻擊、防禦)
            const statsGrid = document.getElementById("stats-grid");
            statsGrid.innerHTML = "";
            const statKeys = [
                { cur: "生命值", max: "生命初始值" },
                { cur: "修為", max: "修為初始值" },
                { cur: "速度", max: "速度初始值" },
                { cur: "攻擊", max: "攻擊初始值" },
                { cur: "防禦", max: "防禦初始值" }
            ];

            statKeys.forEach(s => {
                // 就算 Firebase 欄位還沒建，也給預設值 0 避免 undefined
                const curVal = data[s.cur] !== undefined ? data[s.cur] : 0;
                const maxVal = data[s.max] !== undefined ? data[s.max] : 0;

                const div = document.createElement("div");
                div.className = "stat-box";
                div.innerHTML = `
                    <label>${s.cur} (上限: ${maxVal})</label>
                    <input type="number" id="input-${s.cur}" value="${curVal}">
                `;
                statsGrid.appendChild(div);
            });

            // 常用道具對應你的 Firebase 實際欄位名稱 (繃帶、修為恢復藥劑、異常解錠、解咒符、封魔匣)
            const itemsGrid = document.getElementById("items-grid");
            itemsGrid.innerHTML = "";
            const itemKeys = [
                { key: "繃帶", label: "繃帶" },
                { key: "修為恢復藥劑", label: "修為恢復藥劑" },
                { key: "異常解錠", label: "異常解錠" },
                { key: "解咒符", label: "解咒符" },
                { key: "封魔匣", label: "封魔匣" }
            ];

            itemKeys.forEach(item => {
                const count = data[item.key] !== undefined ? data[item.key] : 0;
                const div = document.createElement("div");
                div.className = "stat-box";
                div.innerHTML = `
                    <label>${item.label}: <span id="val-${item.key}">${count}</span></label>
                    <button class="btn-danger" onclick="useItem('${item.key}')">使用 / 減少 1 個</button>
                `;
                itemsGrid.appendChild(div);
            });

            // 其餘道具
            renderCustomItems(data["其餘道具"] || []);
        }

        // 扣減道具
        window.useItem = async (itemKey) => {
            if (localData[itemKey] && localData[itemKey] > 0) {
                localData[itemKey] -= 1;
                await updateDoc(docRef, { [itemKey]: localData[itemKey] });
            } else {
                alert("道具數量不足！");
            }
        };

        function renderCustomItems(itemsArray) {
            const container = document.getElementById("custom-items-list");
            container.innerHTML = "<strong>其餘道具清單：</strong><br>";
            if (!itemsArray || itemsArray === "" || (Array.isArray(itemsArray) && itemsArray.length === 0)) {
                container.innerHTML += "<span style='color:#777;'>無</span>";
                return;
            }
            // 兼容字串或陣列
            let list = Array.isArray(itemsArray) ? itemsArray : [itemsArray];
            list.forEach((item, index) => {
                container.innerHTML += `<span style="display:inline-block; background:#333; padding:4px 8px; margin:4px; border-radius:4px;">${item}</span>`;
            });
        }

        // 儲存按鈕
        document.getElementById("save-btn").addEventListener("click", async () => {
            const updatedData = {};
            const statKeys = ["生命值", "修為", "速度", "攻擊", "防禦"];
            statKeys.forEach(key => {
                const input = document.getElementById(`input-${key}`);
                if (input) updatedData[key] = Number(input.value);
            });

            try {
                await updateDoc(docRef, updatedData);
                alert("數值儲存成功！");
            } catch (error) {
                console.error(error);
                alert("儲存失敗");
            }
        });
    </script>
</body>
</html>
