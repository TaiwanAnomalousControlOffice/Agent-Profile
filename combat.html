<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRPG 戰鬥動態排序與 Boss 面板</title>
    <style>
        body { font-family: sans-serif; background: #090d16; color: #f1f5f9; padding: 20px; max-width: 1000px; margin: auto; }
        h1, h2 { color: #38bdf8; }
        .panel { background: #1e293b; padding: 20px; border-radius: 8px; margin-bottom: 25px; border: 1px solid #334155; }
        .combat-card { background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #475569; display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 15px; }
        .combat-card.monster { border-left: 5px solid #f43f5e; background: #221821; }
        .combat-card.boss { border-left: 5px solid #a855f7; background: #2a1b3d; }
        .combat-card.player { border-left: 5px solid #38bdf8; }
        .info-group { flex: 1; min-width: 280px; }
        
        /* 數值網格與卡片微調 */
        .stats-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 10px; }
        .stat-card { background: #0f172a; padding: 8px 6px; border-radius: 6px; text-align: center; border: 1px solid #334155; }
        .stat-title { font-size: 0.75rem; color: #94a3b8; display: block; margin-bottom: 2px; }
        .stat-limit { font-size: 0.7rem; color: #cbd5e1; display: block; margin-bottom: 4px; }
        
        /* 數值輸入與按鈕優化 */
        .stat-input { width: 100%; background: transparent; border: none; color: #facc15; font-size: 1.1rem; font-weight: bold; text-align: center; padding: 2px 0; box-sizing: border-box; }
        .stat-input:focus { outline: 1px solid #38bdf8; border-radius: 4px; background: #1e293b; }
        .stat-buttons { display: flex; gap: 2px; justify-content: center; margin-top: 6px; }
        .btn-adjust { background: #1f2937; color: #9ca3af; border: 1px solid #374151; border-radius: 3px; padding: 2px 4px; font-size: 0.7rem; cursor: pointer; flex: 1; }
        .btn-adjust:hover { background: #374151; color: #ffffff; }

        input, select { width: 100%; padding: 6px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 4px; box-sizing: border-box; margin-top: 4px; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 8px 14px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0ea5e9; }
        .btn-danger { background: #f43f5e; color: #fff; }
        .btn-danger:hover { background: #e11d48; }
        .btn-boss { background: #a855f7; color: #fff; }
        .btn-boss:hover { background: #9333ea; }
        .btn-secondary { background: #334155; color: #cbd5e1; }
        .btn-secondary:hover { background: #475569; color: #fff; }
        .btn-sm { padding: 4px 8px; font-size: 0.75rem; font-weight: bold; }
        .form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
        .checkbox-group { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; background: #0f172a; padding: 10px; border-radius: 6px; }
        .checkbox-label { display: flex; align-items: center; gap: 6px; cursor: pointer; color: #cbd5e1; font-size: 0.9rem; }
        .control-panel { background: #0f172a; padding: 10px; border-radius: 6px; flex: 1; min-width: 260px; font-size: 0.85rem; }
        
        /* 道具調整網格 */
        .item-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; margin-top: 6px; }
        .item-row { display: flex; align-items: center; justify-content: space-between; background: #1e293b; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; }
        .item-row input { width: 40px; padding: 2px; text-align: center; font-size: 0.8rem; background: #0f172a; color: #facc15; border: 1px solid #475569; }
        
        /* 資料庫卡片列表 */
        .template-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin-top: 10px; }
        .template-card { background: #0f172a; border: 1px solid #334155; padding: 10px; border-radius: 6px; font-size: 0.85rem; }
        
        /* 技能與消耗設定網格 */
        .skill-input-group { background: #0f172a; padding: 8px; border-radius: 6px; margin-top: 6px; border: 1px solid #334155; }
        .skill-row { display: flex; gap: 6px; margin-top: 4px; }
    </style>
</head>
<body>

    <h1>⚔️ TRPG 戰鬥動態排序與 Boss 面板[cite: 10]</h1>
    <p style="color: #94a3b8;">勾選參戰玩家，系統將自動依據人數計算 Boss 血量加成，並統一按速度排序。</p>

    <!-- 戰鬥序列列表 -->
    <h2 style="margin-top: 30px;">📊 回合行動序列 (速度排序)</h2>
    <div id="battle-list">載入中...</div>

    <!-- 玩家參戰勾選面板 -->
    <div class="panel" style="margin-top: 25px;">
        <h2>🛡 選擇本次參戰玩家</h2>
        <div id="player-checkboxes" class="checkbox-group">載入玩家清單中...</div>
    </div>

    <!-- 魔物與 BOSS 範本資料庫面板 -->
    <div class="panel" style="border-color: #64748b;">
        <h2>📚 魔物 / BOSS 範本資料庫 (可重複快速召喚)</h2>
        <p style="font-size: 0.85rem; color: #94a3b8; margin-top: -5px;">在此建立常用敵人的數值模板，點擊「快速上場」即可一鍵部署到戰場上（支援同種魔物多次上場）。</p>
        <div id="template-container" class="template-list">載入範本資料庫中...</div>
    </div>

    <!-- 新增一般魔物至資料庫面板 -->
    <div class="panel">
        <h2>👹 新增一般魔物至資料庫</h2>
        <div class="form-grid">
            <div><label>魔物名稱 / 代號</label><input type="text" id="m-name" placeholder="例如：山精野怪"></div>
            <div>
                <label>屬性</label>
                <select id="m-element">
                    <option value="無">無</option>
                    <option value="金">金</option>
                    <option value="木">木</option>
                    <option value="水">水</option>
                    <option value="火">火</option>
                    <option value="土">土</option>
                </select>
            </div>
            <div><label>速度 (決定順序)</label><input type="number" id="m-speed" value="10"></div>
            <div><label>生命值 (當前 / 初始)</label><input type="number" id="m-hp" value="50"></div>
            <div><label>修為值 (當前 / 初始)</label><input type="number" id="m-mp" value="20"></div>
            <div><label>攻擊力</label><input type="number" id="m-atk" value="15"></div>
            <div><label>防禦力</label><input type="number" id="m-def" value="5"></div>
        </div>
        
        <!-- 技能與修為消耗設定 -->
        <label style="display:block; margin-top:8px; font-weight:bold; color:#38bdf8;">技能與修為消耗設定</label>
        <div class="skill-input-group">
            <div class="skill-row">
                <input type="text" id="m-skill1-name" placeholder="技能 1 名稱" style="flex:2;">
                <input type="number" id="m-skill1-cost" placeholder="消耗修為" value="5" style="flex:1;">
            </div>
            <div class="skill-row">
                <input type="text" id="m-skill2-name" placeholder="技能 2 名稱" style="flex:2;">
                <input type="number" id="m-skill2-cost" placeholder="消耗修為" value="10" style="flex:1;">
            </div>
            <div class="skill-row">
                <input type="text" id="m-skill3-name" placeholder="技能 3 名稱" style="flex:2;">
                <input type="number" id="m-skill3-cost" placeholder="消耗修為" value="15" style="flex:1;">
            </div>
        </div>

        <button class="btn-danger" id="add-monster-btn" style="margin-top: 12px;">💾 儲存一般魔物至資料庫</button>
    </div>

    <!-- 新增 BOSS 至資料庫面板 -->
    <div class="panel" style="border-color: #a855f7;">
        <h2>👑 創造 BOSS 範本 (自動依參戰人數加成血量)</h2>
        <div class="form-grid">
            <div><label>BOSS 名稱</label><input type="text" id="b-name" placeholder="例如：千年虎妖"></div>
            <div>
                <label>屬性</label>
                <select id="b-element">
                    <option value="土">土</option>
                    <option value="金">金</option>
                    <option value="木">木</option>
                    <option value="水">水</option>
                    <option value="火">火</option>
                    <option value="無">無</option>
                </select>
            </div>
            <div><label>速度 (決定順序)</label><input type="number" id="b-speed" value="15"></div>
            <div><label>基礎生命值 (1人時的血量)</label><input type="number" id="b-hp" value="30"></div>
            <div><label>修為值 (當前 / 初始)</label><input type="number" id="b-mp" value="50"></div>
            <div><label>攻擊力</label><input type="number" id="b-atk" value="25"></div>
            <div><label>防禦力</label><input type="number" id="b-def" value="10"></div>
        </div>

        <!-- BOSS 技能與修為消耗設定 -->
        <label style="display:block; margin-top:8px; font-weight:bold; color:#c084fc;">BOSS 技能與修為消耗設定</label>
        <div class="skill-input-group">
            <div class="skill-row">
                <input type="text" id="b-skill1-name" placeholder="Boss 技能 1 名稱" style="flex:2;">
                <input type="number" id="b-skill1-cost" placeholder="消耗修為" value="10" style="flex:1;">
            </div>
            <div class="skill-row">
                <input type="text" id="b-skill2-name" placeholder="Boss 技能 2 名稱" style="flex:2;">
                <input type="number" id="b-skill2-cost" placeholder="消耗修為" value="20" style="flex:1;">
            </div>
            <div class="skill-row">
                <input type="text" id="b-skill3-name" placeholder="Boss 技能 3 名稱" style="flex:2;">
                <input type="number" id="b-skill3-cost" placeholder="消耗修為" value="30" style="flex:1;">
            </div>
        </div>

        <button class="btn-boss" id="add-boss-btn" style="margin-top: 12px;">💾 儲存 BOSS 範本至資料庫</button>
    </div>

    <script type="module">
        import { db } from "./firebase-config.js";
        import { collection, onSnapshot, addDoc, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const battleList = document.getElementById("battle-list");
        const checkboxContainer = document.getElementById("player-checkboxes");
        const templateContainer = document.getElementById("template-container");
        
        let allPlayersData = [];
        let monsterTemplatesData = []; 
        let monstersData = [];          
        let selectedPlayerIds = new Set(); 

        // 1. 監聽 players 集合
        onSnapshot(collection(db, "players"), (snapshot) => {
            allPlayersData = [];
            snapshot.forEach((docSnap) => {
                allPlayersData.push({ id: docSnap.id, type: 'player', ...docSnap.data() });
            });
            
            if (selectedPlayerIds.size === 0 && allPlayersData.length > 0) {
                allPlayersData.forEach(p => selectedPlayerIds.add(p.id));
            }

            renderPlayerCheckboxes();
            updateAndRender();
        }, (error) => {
            console.error("讀取玩家失敗:", error);
            checkboxContainer.innerHTML = `<span style="color:#f43f5e;">讀取玩家失敗: ${error.message}</span>`;
        });

        // 2. 監聽 monster_templates 集合
        onSnapshot(collection(db, "monster_templates"), (snapshot) => {
            monsterTemplatesData = [];
            snapshot.forEach((docSnap) => {
                monsterTemplatesData.push({ id: docSnap.id, ...docSnap.data() });
            });
            renderTemplates();
        }, (error) => {
            console.log("尚無 monster_templates 集合或讀取中");
            templateContainer.innerHTML = "<span style='color:#777;'>尚無儲存的魔物範本。</span>";
        });

        // 3. 監聽 monsters 集合
        onSnapshot(collection(db, "monsters"), (snapshot) => {
            monstersData = [];
            snapshot.forEach((docSnap) => {
                monstersData.push({ id: docSnap.id, type: 'monster', ...docSnap.data() });
            });
            updateAndRender();
        }, (error) => {
            console.log("尚無 monsters 集合或讀取中");
        });

        function renderPlayerCheckboxes() {
            if (allPlayersData.length === 0) {
                checkboxContainer.innerHTML = "<span style='color:#777;'>目前沒有任何玩家資料。</span>";
                return;
            }

            checkboxContainer.innerHTML = "";
            allPlayersData.forEach(p => {
                const isChecked = selectedPlayerIds.has(p.id);
                const name = p.代號 || p.姓名 || p.id;
                const label = document.createElement("label");
                label.className = "checkbox-label";
                label.innerHTML = `
                    <input type="checkbox" value="${p.id}" ${isChecked ? 'checked' : ''} data-id="${p.id}" class="player-chk">
                    ${name} (${p.id})
                `;
                checkboxContainer.appendChild(label);
            });

            document.querySelectorAll('.player-chk').forEach(chk => {
                chk.addEventListener('change', (e) => {
                    const id = e.target.getAttribute('data-id');
                    if (e.target.checked) {
                        selectedPlayerIds.add(id);
                    } else {
                        selectedPlayerIds.delete(id);
                    }
                    updateAndRender();
                });
            });
        }

        function renderTemplates() {
            if (monsterTemplatesData.length === 0) {
                templateContainer.innerHTML = "<span style='color:#777; font-size:0.85rem;'>資料庫目前沒有魔物或 BOSS 範本。請在下方新增。</span>";
                return;
            }

            templateContainer.innerHTML = "";
            monsterTemplatesData.forEach(tmpl => {
                const isBoss = tmpl.isBoss;
                const card = document.createElement("div");
                card.className = "template-card";
                card.style.borderColor = isBoss ? '#a855f7' : '#475569';
                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 4px;">
                        <strong style="color: ${isBoss ? '#c084fc' : '#38bdf8'};">${isBoss ? '👑' : '👹'} ${tmpl.姓名}</strong>
                        <span style="font-size: 0.7rem; color: #94a3b8; background: #1e293b; padding: 1px 4px; border-radius: 3px;">[${tmpl.屬性 || '無'}] 速:${tmpl.速度}</span>
                    </div>
                    <div style="font-size: 0.75rem; color: #cbd5e1; margin-bottom: 8px;">
                        生命: ${tmpl.生命初始值} | 攻: ${tmpl.攻擊} | 防: ${tmpl.防禦}
                    </div>
                    <div style="display:flex; gap: 4px;">
                        <button class="btn-sm" style="flex:1; background:${isBoss ? '#a855f7' : '#38bdf8'}; color:#0f172a;" onclick="window.spawnEnemyFromTemplate('${tmpl.id}')">⚡ 快速上場</button>
                        <button class="btn-sm btn-danger" onclick="window.deleteTemplate('${tmpl.id}')">刪除</button>
                    </div>
                `;
                templateContainer.appendChild(card);
            });
        }

        function updateAndRender() {
            const activePlayers = allPlayersData.filter(p => selectedPlayerIds.has(p.id));
            let allEntities = [...activePlayers, ...monstersData];

            allEntities.sort((a, b) => {
                const speedA = Number(a["速度"] !== undefined ? a["速度"] : (a["速度初始值"] || 0));
                const speedB = Number(b["速度"] !== undefined ? b["速度"] : (b["速度初始值"] || 0));
                return speedB - speedA;
            });

            if (allEntities.length === 0) {
                battleList.innerHTML = "<p>目前沒有任何參戰角色或魔物。</p>";
                return;
            }

            battleList.innerHTML = "";
            allEntities.forEach((item, index) => {
                const isMonster = item.type === 'monster';
                const isBoss = isMonster && item.isBoss;
                
                let cardClass = 'player';
                if (isBoss) cardClass = 'boss';
                else if (isMonster) cardClass = 'monster';

                const card = document.createElement("div");
                card.className = `combat-card ${cardClass}`;

                const name = item.代號 || item.姓名 || '未命名';
                const element = item.屬性 ? `屬性: ${item.屬性}` : '';
                let tag = `🛡 玩家 (${item.id})`;
                if (isBoss) tag = `👑 BOSS [${element}]`;
                else if (isMonster) tag = `👹 魔物 [${element}]`;

                const speed = item["速度"] !== undefined ? item["速度"] : (item["速度初始值"] || 0);
                const hp = item["生命值"] || 0;
                const hpMax = item["生命初始值"] || 0;
                const mp = item["修為"] || 0;
                const mpMax = item["修為初始值"] || 0;
                const atk = item["攻擊"] || 0;
                const def = item["防禦"] || 0;
                const colType = isMonster ? 'monster' : 'player';

                let html = `
                    <div class="info-group">
                        <span style="font-size: 0.8rem; color: #94a3b8;">#${index + 1} | ${tag}</span>
                        <h3 style="margin: 2px 0 6px 0;">${name}</h3>
                        <div class="stats-grid">
                            <!-- 生命值 -->
                            <div class="stat-card">
                                <span class="stat-title">生命</span>
                                <span class="stat-limit">/ ${hpMax}</span>
                                <input type="number" class="stat-input" value="${hp}" onchange="window.directUpdateStat('${item.id}', '${colType}', '生命值', this.value)">
                                <div class="stat-buttons">
                                    <button class="btn-adjust" onclick="window.adjustStatDirect('${item.id}', '${colType}', '生命值', -10)">-10</button>
                                    <button class="btn-adjust" onclick="window.adjustStatDirect('${item.id}', '${colType}', '生命值', 10)">+10</button>
                                </div>
                            </div>
                            <!-- 修為 -->
                            <div class="stat-card">
                                <span class="stat-title">修為</span>
                                <span class="stat-limit">/ ${mpMax}</span>
                                <input type="number" class="stat-input" value="${mp}" onchange="window.directUpdateStat('${item.id}', '${colType}', '修為', this.value)">
                                <div class="stat-buttons">
                                    <button class="btn-adjust" onclick="window.adjustStatDirect('${item.id}', '${colType}', '修為', -5)">-5</button>
                                    <button class="btn-adjust" onclick="window.adjustStatDirect('${item.id}', '${colType}', '修為', 5)">+5</button>
                                </div>
                            </div>
                            <!-- 速度 -->
                            <div class="stat-card">
                                <span class="stat-title">速度</span>
                                <span class="stat-limit">&nbsp;</span>
                                <input type="number" class="stat-input" value="${speed}" onchange="window.directUpdateStat('${item.id}', '${colType}', '速度', this.value)">
                                <div class="stat-buttons">
                                    <button class="btn-adjust" onclick="window.adjustStatDirect('${item.id}', '${colType}', '速度', -1)">-1</button>
                                    <button class="btn-adjust" onclick="window.adjustStatDirect('${item.id}', '${colType}', '速度', 1)">+1</button>
                                </div>
                            </div>
                            <!-- 攻擊 -->
                            <div class="stat-card">
                                <span class="stat-title">攻擊</span>
                                <span class="stat-limit">&nbsp;</span>
                                <input type="number" class="stat-input" value="${atk}" onchange="window.directUpdateStat('${item.id}', '${colType}', '攻擊', this.value)">
                                <div class="stat-buttons">
                                    <button class="btn-adjust" onclick="window.adjustStatDirect('${item.id}', '${colType}', '攻擊', -2)">-2</button>
                                    <button class="btn-adjust" onclick="window.adjustStatDirect('${item.id}', '${colType}', '攻擊', 2)">+2</button>
                                </div>
                            </div>
                            <!-- 防禦 -->
                            <div class="stat-card">
                                <span class="stat-title">防禦</span>
                                <span class="stat-limit">&nbsp;</span>
                                <input type="number" class="stat-input" value="${def}" onchange="window.directUpdateStat('${item.id}', '${colType}', '防禦', this.value)">
                                <div class="stat-buttons">
                                    <button class="btn-adjust" onclick="window.adjustStatDirect('${item.id}', '${colType}', '防禦', -2)">-2</button>
                                    <button class="btn-adjust" onclick="window.adjustStatDirect('${item.id}', '${colType}', '防禦', 2)">+2</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                html += `<div class="control-panel" style="max-width: 250px;">`;
                
                if (!isMonster) {
                    html += `<div style="color: #38bdf8; font-weight: bold; margin-bottom: 6px;">🎒 玩家道具數量調整</div>`;
                    html += `<div class="item-grid">
                        <div class="item-row"><span>繃帶</span><input type="number" value="${item["高效治療繃帶"] || 0}" onchange="window.directUpdateStat('${item.id}', 'player', '高效治療繃帶', this.value)"></div>
                        <div class="item-row"><span>藥劑</span><input type="number" value="${item["修為恢復藥劑"] || 0}" onchange="window.directUpdateStat('${item.id}', 'player', '修為恢復藥劑', this.value)"></div>
                        <div class="item-row"><span>解錠</span><input type="number" value="${item["異常解除錠"] || 0}" onchange="window.directUpdateStat('${item.id}', 'player', '異常解除錠', this.value)"></div>
                        <div class="item-row"><span>解咒</span><input type="number" value="${item["解咒符"] || 0}" onchange="window.directUpdateStat('${item.id}', 'player', '解咒符', this.value)"></div>
                        <div class="item-row" style="grid-column: span 2;"><span>封魔匣</span><input type="number" value="${item["封魔匣"] || 0}" onchange="window.directUpdateStat('${item.id}', 'player', '封魔匣', this.value)"></div>
                    </div>`;
                } else {
                    html += `<div style="color: ${isBoss ? '#c084fc' : '#f43f5e'}; font-weight: bold; margin-bottom: 6px;">${isBoss ? '👑 技能施放 (自動扣修為)' : '👹 技能施放 (自動扣修為)'}</div>`;
                    
                    // 技能 1
                    if (item.skill1Name && item.skill1Name !== '無') {
                        html += `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; font-size:0.8rem;">
                            <span>${item.skill1Name} <b style="color:#38bdf8;">(-${item.skill1Cost || 0})</b></span>
                            <button class="btn-sm" style="background:${isBoss ? '#a855f7' : '#f43f5e'}; color:#fff;" onclick="window.useMonsterSkill('${item.id}', '${item.skill1Name}', ${item.skill1Cost || 0})">施放</button>
                        </div>`;
                    }
                    // 技能 2
                    if (item.skill2Name && item.skill2Name !== '無') {
                        html += `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; font-size:0.8rem;">
                            <span>${item.skill2Name} <b style="color:#38bdf8;">(-${item.skill2Cost || 0})</b></span>
                            <button class="btn-sm" style="background:${isBoss ? '#a855f7' : '#f43f5e'}; color:#fff;" onclick="window.useMonsterSkill('${item.id}', '${item.skill2Name}', ${item.skill2Cost || 0})">施放</button>
                        </div>`;
                    }
                    // 技能 3
                    if (item.skill3Name && item.skill3Name !== '無') {
                        html += `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; font-size:0.8rem;">
                            <span>${item.skill3Name} <b style="color:#38bdf8;">(-${item.skill3Cost || 0})</b></span>
                            <button class="btn-sm" style="background:${isBoss ? '#a855f7' : '#f43f5e'}; color:#fff;" onclick="window.useMonsterSkill('${item.id}', '${item.skill3Name}', ${item.skill3Cost || 0})">施放</button>
                        </div>`;
                    }

                    if (!item.skill1Name && !item.skill2Name && !item.skill3Name) {
                        html += `<div style="color:#94a3b8; font-size:0.75rem; margin-bottom:6px;">無設定主動技能</div>`;
                    }

                    html += `<button class="btn-danger btn-sm" style="width:100%; margin-top:8px;" onclick="window.deleteMonsterItem('${item.id}')">撤下${isBoss ? ' BOSS' : '魔物'}</button>`;
                }

                html += `</div>`;
                card.innerHTML = html;
                battleList.appendChild(card);
            });
        }

        // 點擊技能按鈕：自動扣除修為
        window.useMonsterSkill = async (monsterId, skillName, cost) => {
            const target = monstersData.find(m => m.id === monsterId);
            if (!target) return;

            const currentMp = Number(target["修為"] || 0);
            if (currentMp < cost) {
                alert(`⚠️️ 修為不足！${target.姓名} 當前修為 (${currentMp}) 無法施放「${skillName}」(需消耗 ${cost})。`);
                return;
            }

            const newMp = currentMp - cost;
            try {
                await updateDoc(doc(db, "monsters", monsterId), {
                    "修為": newMp
                });
                console.log(`[技能施放] ${target.姓名} 施放 ${skillName}，消耗修為 ${cost}`);
            } catch (e) {
                console.error(e);
                alert("修為扣除失敗！");
            }
        };

        // 直接輸入數值修改
        window.directUpdateStat = async (id, collectionType, fieldName, value) => {
            const targetCol = collectionType === 'player' ? "players" : "monsters";
            const currentList = collectionType === 'player' ? allPlayersData : monstersData;
            const targetItem = currentList.find(i => i.id === id);
            
            if (!targetItem) return;

            let newValue = Number(value);
            if (isNaN(newValue)) return;

            let maxVal = fieldName === '生命值' ? Number(targetItem['生命初始值'] || 999999) : 
                         fieldName === '修為' ? Number(targetItem['修為初始值'] || 999999) : 999999;

            if (fieldName === '生命值' || fieldName === '修為') {
                if (newValue < 0) newValue = 0;
                if (newValue > maxVal) newValue = maxVal;
            } else {
                if (newValue < 0) newValue = 0;
            }

            try {
                await updateDoc(doc(db, targetCol, id), {
                    [fieldName]: newValue
                });
            } catch (e) {
                console.error(e);
                alert("數值更新失敗！");
            }
        };

        // 點擊快捷增減按鈕
        window.adjustStatDirect = async (id, collectionType, fieldName, delta) => {
            const targetCol = collectionType === 'player' ? "players" : "monsters";
            const currentList = collectionType === 'player' ? allPlayersData : monstersData;
            const targetItem = currentList.find(i => i.id === id);
            
            if (!targetItem) return;

            let currentVal = Number(targetItem[fieldName] || 0);
            let maxVal = fieldName === '生命值' ? Number(targetItem['生命初始值'] || 999999) : 
                         fieldName === '修為' ? Number(targetItem['修為初始值'] || 999999) : 999999;

            let finalVal = currentVal + delta;
            if (fieldName === '生命值' || fieldName === '修為') {
                if (finalVal < 0) finalVal = 0;
                if (finalVal > maxVal) finalVal = maxVal;
            } else {
                if (finalVal < 0) finalVal = 0;
            }

            try {
                await updateDoc(doc(db, targetCol, id), {
                    [fieldName]: finalVal
                });
            } catch (e) {
                console.error(e);
                alert("數值更新失敗！");
            }
        };

        // 新增一般魔物至資料庫
        document.getElementById("add-monster-btn").addEventListener("click", async () => {
            const name = document.getElementById("m-name").value.trim();
            if (!name) { alert("請輸入魔物名稱！"); return; }

            const templateData = {
                姓名: name, 代號: name, isBoss: false,
                屬性: document.getElementById("m-element").value,
                速度: Number(document.getElementById("m-speed").value) || 10,
                速度初始值: Number(document.getElementById("m-speed").value) || 10,
                生命值: Number(document.getElementById("m-hp").value) || 50,
                生命初始值: Number(document.getElementById("m-hp").value) || 50,
                修為: Number(document.getElementById("m-mp").value) || 20,
                修為初始值: Number(document.getElementById("m-mp").value) || 20,
                攻擊: Number(document.getElementById("m-atk").value) || 15,
                攻擊初始值: Number(document.getElementById("m-atk").value) || 15,
                防禦: Number(document.getElementById("m-def").value) || 5,
                防禦初始值: Number(document.getElementById("m-def").value) || 5,
                skill1Name: document.getElementById("m-skill1-name").value.trim(),
                skill1Cost: Number(document.getElementById("m-skill1-cost").value) || 0,
                skill2Name: document.getElementById("m-skill2-name").value.trim(),
                skill2Cost: Number(document.getElementById("m-skill2-cost").value) || 0,
                skill3Name: document.getElementById("m-skill3-name").value.trim(),
                skill3Cost: Number(document.getElementById("m-skill3-cost").value) || 0
            };

            try {
                await addDoc(collection(db, "monster_templates"), templateData);
                alert("魔物範本已成功存入資料庫！");
                document.getElementById("m-name").value = "";
            } catch (e) { console.error(e); alert("儲存失敗"); }
        });

        // 新增 BOSS 至資料庫
        document.getElementById("add-boss-btn").addEventListener("click", async () => {
            const name = document.getElementById("b-name").value.trim();
            if (!name) { alert("請輸入 BOSS 名稱！"); return; }

            const templateData = {
                姓名: name, 代號: name, isBoss: true,
                屬性: document.getElementById("b-element").value,
                速度: Number(document.getElementById("b-speed").value) || 15,
                速度初始值: Number(document.getElementById("b-speed").value) || 15,
                生命值: Number(document.getElementById("b-hp").value) || 30,
                生命初始值: Number(document.getElementById("b-hp").value) || 30,
                修為: Number(document.getElementById("b-mp").value) || 50,
                修為初始值: Number(document.getElementById("b-mp").value) || 50,
                攻擊: Number(document.getElementById("b-atk").value) || 25,
                攻擊初始值: Number(document.getElementById("b-atk").value) || 25,
                防禦: Number(document.getElementById("b-def").value) || 10,
                防禦初始值: Number(document.getElementById("b-def").value) || 10,
                skill1Name: document.getElementById("b-skill1-name").value.trim(),
                skill1Cost: Number(document.getElementById("b-skill1-cost").value) || 0,
                skill2Name: document.getElementById("b-skill2-name").value.trim(),
                skill2Cost: Number(document.getElementById("b-skill2-cost").value) || 0,
                skill3Name: document.getElementById("b-skill3-name").value.trim(),
                skill3Cost: Number(document.getElementById("b-skill3-cost").value) || 0
            };

            try {
                await addDoc(collection(db, "monster_templates"), templateData);
                alert("👑 BOSS 範本已成功存入資料庫！");
                document.getElementById("b-name").value = "";
            } catch (e) { console.error(e); alert("儲存 BOSS 失敗"); }
        });

        // 快速召喚敵人到戰場上
        window.spawnEnemyFromTemplate = async (templateId) => {
            const tmpl = monsterTemplatesData.find(t => t.id === templateId);
            if (!tmpl) return;

            let finalHp = tmpl.生命初始值;
            if (tmpl.isBoss) {
                const activePlayerCount = selectedPlayerIds.size;
                const count = Math.max(activePlayerCount, 1);
                const multiplier = 1 + (count - 1) * 0.5;
                finalHp = Math.round(tmpl.生命初始值 * multiplier);
            }

            const battleInstance = {
                ...tmpl,
                生命值: finalHp,
                生命初始值: finalHp
            };
            delete battleInstance.id;

            try {
                await addDoc(collection(db, "monsters"), battleInstance);
                if (tmpl.isBoss) {
                    alert(`👑 BOSS [${tmpl.姓名}] 已上場！\n參戰人數：${selectedPlayerIds.size} 人\n最終血量：${finalHp}`);
                }
            } catch (e) {
                console.error(e);
                alert("召喚失敗！");
            }
        };

        // 刪除資料庫範本
        window.deleteTemplate = async (id) => {
            if (!confirm("確定要從資料庫刪除這個範本嗎？")) return;
            try {
                await deleteDoc(doc(db, "monster_templates", id));
            } catch (e) { console.error(e); alert("刪除失敗"); }
        };

        // 從戰場撤下怪物
        window.deleteMonsterItem = async (id) => {
            if (!confirm("確定要將其從戰鬥中移除嗎？")) return;
            try {
                await deleteDoc(doc(db, "monsters", id));
            } catch (e) { console.error(e); alert("移除失敗"); }
        };
    </script>
</body>
</html>
