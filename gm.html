<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>GM 遊戲管理面板 (TRPG-NFC)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-6">
    <div class="max-w-7xl mx-auto space-y-4">
        <div class="flex justify-between items-center bg-slate-900 p-3 rounded-xl border border-slate-800 shadow-lg">
            <h1 class="text-2xl font-bold text-amber-400">GM 遊戲管理面板</h1>
            <button onclick="createNewPlayer()" class="bg-amber-600 hover:bg-amber-500 px-3 py-1.5 rounded-lg text-sm font-bold cursor-pointer transition">＋ 建立新角色</button>
        </div>

        <!-- 玩家列表容器 -->
        <div id="playersContainer" class="space-y-4">
            <div id="statusMsg" class="text-center py-10 text-slate-400">正在連線至 Firestore 讀取玩家資料...</div>
        </div>
    </div>

    <!-- Firebase Firestore 邏輯 -->
    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, onSnapshot, doc, updateDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const container = document.getElementById('playersContainer');

        try {
            onSnapshot(collection(db, "players"), (snapshot) => {
                if (snapshot.empty) {
                    container.innerHTML = '<div class="text-center py-10 text-amber-500">資料庫連線成功，但目前 players 集合內沒有任何文檔。</div>';
                    return;
                }

                container.innerHTML = '';

                snapshot.forEach((docSnap) => {
                    const id = docSnap.id;
                    const p = docSnap.data();
                    const card = document.createElement('div');
                    card.className = "bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-xl space-y-4";
                    
                    const avatarUrl = p.頭像 || p.avatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80';
                    const primaryName = p.代號 || p.姓名 || '未命名';
                    const subName = p.代號 ? `(姓名: ${p.姓名 || '-'})` : '';

                    card.innerHTML = `
                        <!-- 1. 基本資料與長短休區 (精簡縮小) -->
                        <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-3 border-b border-slate-800 pb-3">
                            <div class="flex items-center gap-3">
                                <img src="${avatarUrl}" alt="頭像" onerror="this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80'" class="w-12 h-12 rounded-full object-cover border-2 border-amber-500 shadow">
                                <div>
                                    <div class="text-lg font-bold text-amber-300">${primaryName} <span class="text-xs font-normal text-slate-400">${subName}</span></div>
                                    <div class="text-xs text-slate-400 mt-0.5">
                                        性別: <span class="text-slate-200">${p.性別 || '-'}</span> | 
                                        年齡: <span class="text-slate-200">${p.年齡 || '-'}</span> | 
                                        種族: <span class="text-slate-200">${p.種族 || '-'}</span> | 
                                        職業: <span class="text-slate-200">${p.職業 || '-'}</span>
                                    </div>
                                </div>
                            </div>
                            <!-- 長短休與資產 -->
                            <div class="flex flex-wrap items-center gap-2">
                                <button onclick="window.shortRest('${id}')" class="bg-blue-600 hover:bg-blue-500 text-xs px-2.5 py-1.5 rounded-lg font-bold cursor-pointer">短休</button>
                                <button onclick="window.longRest('${id}')" class="bg-indigo-600 hover:bg-indigo-500 text-xs px-2.5 py-1.5 rounded-lg font-bold cursor-pointer">長休</button>
                                <div class="flex items-center gap-1 bg-slate-800 px-2 py-1 rounded-lg border border-slate-700">
                                    <span class="text-[11px] text-slate-400">資產:</span>
                                    <input type="number" value="${p.資產 ?? 0}" onchange="window.updateField('${id}', '資產', parseInt(this.value) || 0)" class="bg-slate-900 border border-slate-700 px-1.5 py-0.5 rounded w-20 text-yellow-400 font-bold text-xs">
                                    <span class="text-[11px] text-slate-400">元</span>
                                </div>
                            </div>
                        </div>

                        <!-- 2. 屬性數值與初始值調整區 (數值可直接修改) -->
                        <div class="grid grid-cols-1 md:grid-cols-5 gap-3">
                            <!-- 生命值 -->
                            <div class="bg-slate-800/60 p-2.5 rounded-lg border border-slate-700/60 space-y-1.5">
                                <div class="flex justify-between items-center text-[11px]">
                                    <span class="font-bold text-slate-300">生命值</span>
                                    <span class="text-slate-400">上限: <input type="number" value="${p.生命初始值 ?? 100}" onchange="window.updateField('${id}', '生命初始值', parseInt(this.value) || 0)" class="w-10 bg-slate-900 text-center rounded border border-slate-700 text-[11px] text-amber-300"></span>
                                </div>
                                <div class="text-center">
                                    <input type="number" value="${p.生命值 ?? 0}" onchange="window.updateField('${id}', '生命值', parseInt(this.value) || 0)" class="w-20 bg-slate-900 border border-slate-700 rounded text-center text-xl font-bold text-red-400 py-0.5">
                                </div>
                                <div class="flex justify-center gap-1">
                                    <button onclick="window.adjustValue('${id}', '生命值', -5, ${p.生命值 ?? 0})" class="bg-slate-700 hover:bg-slate-600 px-1 py-0.5 rounded text-[10px]">-5</button>
                                    <button onclick="window.adjustValue('${id}', '生命值', -1, ${p.生命值 ?? 0})" class="bg-slate-700 hover:bg-slate-600 px-1 py-0.5 rounded text-[10px]">-1</button>
                                    <button onclick="window.adjustValue('${id}', '生命值', 1, ${p.生命值 ?? 0})" class="bg-slate-700 hover:bg-slate-600 px-1 py-0.5 rounded text-[10px]">+1</button>
                                    <button onclick="window.adjustValue('${id}', '生命值', 5, ${p.生命值 ?? 0})" class="bg-slate-700 hover:bg-slate-600 px-1 py-0.5 rounded text-[10px]">+5</button>
                                </div>
                            </div>

                            <!-- 修為 -->
                            <div class="bg-slate-800/60 p-2.5 rounded-lg border border-slate-700/60 space-y-1.5">
                                <div class="flex justify-between items-center text-[11px]">
                                    <span class="font-bold text-slate-300">修為</span>
                                    <span class="text-slate-400">上限: <input type="number" value="${p.修為初始值 ?? 50}" onchange="window.updateField('${id}', '修為初始值', parseInt(this.value) || 0)" class="w-10 bg-slate-900 text-center rounded border border-slate-700 text-[11px] text-amber-300"></span>
                                </div>
                                <div class="text-center">
                                    <input type="number" value="${p.修為 ?? 0}" onchange="window.updateField('${id}', '修為', parseInt(this.value) || 0)" class="w-20 bg-slate-900 border border-slate-700 rounded text-center text-xl font-bold text-cyan-400 py-0.5">
                                </div>
                                <div class="flex justify-center gap-1">
                                    <button onclick="window.adjustValue('${id}', '修為', -5, ${p.修為 ?? 0})" class="bg-slate-700 hover:bg-slate-600 px-1 py-0.5 rounded text-[10px]">-5</button>
                                    <button onclick="window.adjustValue('${id}', '修為', -1, ${p.修為 ?? 0})" class="bg-slate-700 hover:bg-slate-600 px-1 py-0.5 rounded text-[10px]">-1</button>
                                    <button onclick="window.adjustValue('${id}', '修為', 1, ${p.修為 ?? 0})" class="bg-slate-700 hover:bg-slate-600 px-1 py-0.5 rounded text-[10px]">+1</button>
                                    <button onclick="window.adjustValue('${id}', '修為', 5, ${p.修為 ?? 0})" class="bg-slate-700 hover:bg-slate-600 px-1 py-0.5 rounded text-[10px]">+5</button>
                                </div>
                            </div>

                            <!-- 速度 -->
                            <div class="bg-slate-800/60 p-2.5 rounded-lg border border-slate-700/60 space-y-1.5">
                                <div class="flex justify-between items-center text-[11px]">
                                    <span class="font-bold text-slate-300">速度</span>
                                    <span class="text-slate-400">初始: <input type="number" value="${p.速度初始值 ?? 10}" onchange="window.updateField('${id}', '速度初始值', parseInt(this.value) || 0)" class="w-10 bg-slate-900 text-center rounded border border-slate-700 text-[11px] text-amber-300"></span>
                                </div>
                                <div class="text-center">
                                    <input type="number" value="${p.速度 ?? 0}" onchange="window.updateField('${id}', '速度', parseInt(this.value) || 0)" class="w-20 bg-slate-900 border border-slate-700 rounded text-center text-xl font-bold text-emerald-400 py-0.5">
                                </div>
                                <div class="flex justify-center gap-1">
                                    <button onclick="window.adjustValue('${id}', '速度', -5, ${p.速度 ?? 0})" class="bg-slate-700 hover:bg-slate-600 px-1 py-0.5 rounded text-[10px]">-5</button>
                                    <button onclick="window.adjustValue('${id}', '速度', -1, ${p.速度 ?? 0})" class="bg-slate-700 hover:bg-slate-600 px-1 py-0.5 rounded text-[10px]">-1</button>
                                    <button onclick="window.adjustValue('${id}', '速度', 1, ${p.速度 ?? 0})" class="bg-slate-700 hover:bg-slate-600 px-1 py-0.5 rounded text-[10px]">+1</button>
                                    <button onclick="window.adjustValue('${id}', '速度', 5, ${p.速度 ?? 0})" class="bg-slate-700 hover:bg-slate-600 px-1 py-0.5 rounded text-[10px]">+5</button>
                                </div>
                            </div>

                            <!-- 攻擊 -->
                            <div class="bg-slate-800/60 p-2.5 rounded-lg border border-slate-700/60 space-y-1.5">
                                <div class="flex justify-between items-center text-[11px]">
                                    <span class="font-bold text-slate-300">攻擊</span>
                                    <span class="text-slate-400">初始: <input type="number" value="${p.攻擊初始值 ?? 10}" onchange="window.updateField('${id}', '攻擊初始值', parseInt(this.value) || 0)" class="w-10 bg-slate-900 text-center rounded border border-slate-700 text-[11px] text-amber-300"></span>
                                </div>
                                <div class="text-center">
                                    <input type="number" value="${p.攻擊 ?? 0}" onchange="window.updateField('${id}', '攻擊', parseInt(this.value) || 0)" class="w-20 bg-slate-900 border border-slate-700 rounded text-center text-xl font-bold text-orange-400 py-0.5">
                                </div>
                                <div class="flex justify-center gap-1">
                                    <button onclick="window.adjustValue('${id}', '攻擊', -1, ${p.攻擊 ?? 0})" class="bg-slate-700 hover:bg-slate-600 px-2 py-0.5 rounded text-[10px]">-1</button>
                                    <button onclick="window.adjustValue('${id}', '攻擊', 1, ${p.攻擊 ?? 0})" class="bg-slate-700 hover:bg-slate-600 px-2 py-0.5 rounded text-[10px]">+1</button>
                                </div>
                            </div>

                            <!-- 防禦 -->
                            <div class="bg-slate-800/60 p-2.5 rounded-lg border border-slate-700/60 space-y-1.5">
                                <div class="flex justify-between items-center text-[11px]">
                                    <span class="font-bold text-slate-300">防禦</span>
                                    <span class="text-slate-400">初始: <input type="number" value="${p.防禦初始值 ?? 10}" onchange="window.updateField('${id}', '防禦初始值', parseInt(this.value) || 0)" class="w-10 bg-slate-900 text-center rounded border border-slate-700 text-[11px] text-amber-300"></span>
                                </div>
                                <div class="text-center">
                                    <input type="number" value="${p.防禦 ?? 0}" onchange="window.updateField('${id}', '防禦', parseInt(this.value) || 0)" class="w-20 bg-slate-900 border border-slate-700 rounded text-center text-xl font-bold text-blue-400 py-0.5">
                                </div>
                                <div class="flex justify-center gap-1">
                                    <button onclick="window.adjustValue('${id}', '防禦', -1, ${p.防禦 ?? 0})" class="bg-slate-700 hover:bg-slate-600 px-2 py-0.5 rounded text-[10px]">-1</button>
                                    <button onclick="window.adjustValue('${id}', '防禦', 1, ${p.防禦 ?? 0})" class="bg-slate-700 hover:bg-slate-600 px-2 py-0.5 rounded text-[10px]">+1</button>
                                </div>
                            </div>
                        </div>

                        <!-- 3. 常用消耗品區 (消耗品數量可直接修改，+/-保留) -->
                        <div class="grid grid-cols-2 md:grid-cols-5 gap-2.5 bg-slate-950/40 p-3 rounded-xl border border-slate-800">
                            ${renderItemControl(id, '高效治療繃帶', p.高效治療繃帶)}
                            ${renderItemControl(id, '修為恢復藥劑', p.修為恢復藥劑)}
                            ${renderItemControl(id, '異常解除錠', p.異常解除錠)}
                            ${renderItemControl(id, '解咒符', p.解咒符)}
                            ${renderItemControl(id, '封魔匣', p.封魔匣)}
                        </div>

                        <!-- 4. 技能與裝備資訊 -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs text-slate-300 bg-slate-950/60 p-3 rounded-xl border border-slate-800">
                            <div class="space-y-1.5">
                                <div class="flex justify-between items-center border-b border-slate-800 pb-1">
                                    <span class="font-bold text-amber-400">技能配置</span>
                                    <button onclick="window.addExtraSkill('${id}')" class="bg-slate-800 hover:bg-slate-700 text-[11px] px-2 py-0.5 rounded border border-slate-700 cursor-pointer">＋ 新增技能</button>
                                </div>
                                <div>種族技能：<span class="text-white">${p['技能:種族'] || '-'}</span></div>
                                <div>職業技能：<span class="text-white">${p['技能:職業'] || '-'}</span></div>
                                <div>特殊技能：<span class="text-white">${p['技能:特殊'] || '-'}</span></div>
                                <div>技能 1：<span class="text-white">${p.技能1 || '-'}</span></div>
                                <div>技能 2：<span class="text-white">${p.技能2 || '-'}</span></div>
                                
                                <div class="font-bold text-amber-400/85 pt-1.5 border-t border-slate-800/60">額外技能清單</div>
                                <div id="extraSkills_${id}" class="space-y-1">
                                    ${renderExtraSkills(id, p.額外技能 || [])}
                                </div>
                            </div>
                            <div class="space-y-1.5">
                                <div class="font-bold text-amber-400 border-b border-slate-800 pb-1">裝備欄位 (可直接修改)</div>
                                <div class="grid grid-cols-2 gap-1.5">
                                    ${renderEquipInput(id, '主手', p.裝備_主手)}
                                    ${renderEquipInput(id, '副手', p.裝備_副手)}
                                    ${renderEquipInput(id, '頭', p.裝備_頭)}
                                    ${renderEquipInput(id, '頸', p.裝備_頸)}
                                    ${renderEquipInput(id, '身', p.裝備_身)}
                                    ${renderEquipInput(id, '手', p.裝備_手)}
                                    ${renderEquipInput(id, '腰', p.裝備_腰)}
                                    ${renderEquipInput(id, '腳', p.裝備_腳)}
                                </div>
                            </div>
                        </div>

                        <!-- 5. 其餘道具區 -->
                        <div class="space-y-2 bg-slate-950/60 p-3 rounded-xl border border-slate-800">
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-xs text-amber-400">其餘道具清單</span>
                                <button onclick="window.addOtherItem('${id}')" class="bg-slate-800 hover:bg-slate-700 text-xs px-2 py-0.5 rounded border border-slate-700 cursor-pointer">＋ 新增道具</button>
                            </div>
                            <div id="otherItems_${id}" class="space-y-1.5">
                                ${renderOtherItemsList(id, p.其餘道具 || [])}
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            });
        } catch (e) {
            console.error(e);
            container.innerHTML = `<div class="text-red-500 text-center py-10">初始化失敗：${e.message}</div>`;
        }

        // 輔助生成道具控制元件 (數量可直接輸入，亦有+/-按鈕)
        function renderItemControl(id, name, val) {
            const count = val ?? 0;
            return `
                <div class="bg-slate-800/40 p-2 rounded-lg border border-slate-700/50 flex flex-col items-center justify-between space-y-1">
                    <span class="text-[11px] font-bold text-slate-300 text-center">${name}</span>
                    <input type="number" value="${count}" onchange="window.updateField('${id}', '${name}', parseInt(this.value) || 0)" class="w-16 bg-slate-900 border border-slate-700 rounded text-center font-bold text-amber-300 text-sm py-0.5">
                    <div class="flex gap-1">
                        <button onclick="window.adjustValue('${id}', '${name}', -1, ${count})" class="bg-slate-700 hover:bg-slate-600 px-1.5 py-0.5 rounded text-[10px]">-1</button>
                        <button onclick="window.adjustValue('${id}', '${name}', 1, ${count})" class="bg-slate-700 hover:bg-slate-600 px-1.5 py-0.5 rounded text-[10px]">+1</button>
                    </div>
                </div>
            `;
        }

        // 裝備欄位輸入框
        function renderEquipInput(id, slotName, val) {
            const dbField = `裝備_${slotName}`;
            return `
                <div class="flex flex-col gap-0.5">
                    <label class="text-[10px] text-slate-400">${slotName}</label>
                    <input type="text" value="${val || ''}" onchange="window.updateField('${id}', '${dbField}', this.value)" class="bg-slate-800 border border-slate-700 px-2 py-0.5 rounded text-white text-xs" placeholder="未裝備">
                </div>
            `;
        }

        // 渲染額外技能列表
        function renderExtraSkills(id, skills) {
            if (!skills || skills.length === 0) return '<div class="text-xs text-slate-500">目前無額外技能</div>';
            return skills.map((sk, idx) => `
                <div class="flex items-center gap-1.5 bg-slate-900 p-1 rounded border border-slate-800">
                    <input type="text" value="${sk || ''}" onchange="window.updateExtraSkill('${id}', ${idx}, this.value)" class="bg-slate-800 border border-slate-700 px-2 py-0.5 rounded flex-1 text-white text-xs" placeholder="技能名稱">
                    <button onclick="window.removeExtraSkill('${id}', ${idx})" class="bg-red-900/60 hover:bg-red-800 text-red-300 px-1.5 py-0.5 rounded text-xs font-bold cursor-pointer">✕</button>
                </div>
            `).join('');
        }

        // 渲染其餘道具列表
        function renderOtherItemsList(id, items) {
            if (!items || items.length === 0) return '<div class="text-xs text-slate-500 text-center py-0.5">目前無其他道具</div>';
            return items.map((item, idx) => `
                <div class="flex items-center gap-2 bg-slate-900 p-1.5 rounded border border-slate-800 text-xs">
                    <input type="text" value="${item.name || ''}" onchange="window.updateOtherItemName('${id}', ${idx}, this.value)" class="bg-slate-800 border border-slate-700 px-2 py-0.5 rounded flex-1 text-slate-200" placeholder="道具名稱">
                    <input type="number" value="${item.qty || 1}" onchange="window.updateOtherItemQty('${id}', ${idx}, parseInt(this.value) || 1)" class="bg-slate-800 border border-slate-700 px-2 py-0.5 rounded w-14 text-center text-slate-200">
                    <button onclick="window.removeOtherItem('${id}', ${idx})" class="text-red-400 hover:text-red-300 px-1.5 py-0.5 font-bold">✕</button>
                </div>
            `).join('');
        }

        // 通用數值增減
        window.adjustValue = async function(playerId, field, delta, currentVal) {
            const newVal = Math.max(0, (currentVal ?? 0) + delta);
            await updateDoc(doc(db, "players", playerId), { [field]: newVal });
        };

        window.updateField = async function(playerId, field, val) {
            await updateDoc(doc(db, "players", playerId), { [field]: val });
        };

        // 短休
        window.shortRest = async function(playerId) {
            const docRef = doc(db, "players", playerId);
            const snap = await getDoc(docRef);
            if (snap.exists()) {
                const d = snap.data();
                const maxHp = d.生命初始值 ?? 100;
                const maxMp = d.修為初始值 ?? 50;
                const maxSpd = d.速度初始值 ?? 10;
                const maxAtk = d.攻擊初始值 ?? 10;
                const maxDef = d.防禦初始值 ?? 10;

                await updateDoc(docRef, {
                    生命值: Math.max(d.生命值 ?? 0, maxHp),
                    修為: Math.max(d.修為 ?? 0, maxMp),
                    速度: Math.max(d.速度 ?? 0, maxSpd),
                    攻擊: Math.max(d.攻擊 ?? 0, maxAtk),
                    防禦: Math.max(d.防禦 ?? 0, maxDef)
                });
                alert("短休完畢：各項數值已恢復至初始值，溢出的高數值已保留！");
            }
        };

        // 長休
        window.longRest = async function(playerId) {
            const docRef = doc(db, "players", playerId);
            const snap = await getDoc(docRef);
            if (snap.exists()) {
                const d = snap.data();
                await updateDoc(docRef, {
                    生命值: d.生命初始值 ?? 100,
                    修為: d.修為初始值 ?? 50,
                    速度: d.速度初始值 ?? 10,
                    攻擊: d.攻擊初始值 ?? 10,
                    防禦: d.防禦初始值 ?? 10
                });
                alert("長休完畢：所有核心數值已強制重置回初始上限！");
            }
        };

        // 額外技能管理
        window.addExtraSkill = async function(playerId) {
            const docRef = doc(db, "players", playerId);
            const snap = await getDoc(docRef);
            if (snap.exists()) {
                const skills = snap.data().額外技能 || [];
                const updated = [...skills, "新技能"];
                await updateDoc(docRef, { 額外技能: updated });
            }
        };

        window.updateExtraSkill = async function(playerId, idx, val) {
            const docRef = doc(db, "players", playerId);
            const snap = await getDoc(docRef);
            if (snap.exists()) {
                let skills = [...(snap.data().額外技能 || [])];
                skills[idx] = val;
