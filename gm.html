<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>GM 遊戲管理面板 (TRPG-NFC)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">
    <div class="max-w-7xl mx-auto space-y-6">
        <div class="flex justify-between items-center bg-slate-900 p-4 rounded-xl border border-slate-800 shadow-lg">
            <h1 class="text-3xl font-bold text-amber-400">GM 遊戲管理面板</h1>
            <button onclick="createNewPlayer()" class="bg-amber-600 hover:bg-amber-500 px-4 py-2 rounded-lg font-bold cursor-pointer transition">＋ 建立新角色</button>
        </div>

        <!-- 玩家列表容器 -->
        <div id="playersContainer" class="space-y-8">
            <div id="statusMsg" class="text-center py-10 text-slate-400">正在連線至 Firestore 讀取玩家資料...</div>
        </div>
    </div>

    <!-- Firebase Firestore 邏輯 -->
    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, onSnapshot, doc, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const container = document.getElementById('playersContainer');

        try {
            onSnapshot(collection(db, "players"), (snapshot) => {
                if (snapshot.empty) {
                    container.innerHTML = '<div class="text-center py-10 text-amber-500">資料庫連線成功，但目前 players 集合內沒有任何文檔。</div>';
                    return;
                }

                container.innerHTML = '';

                snapshot.forEach((docSnap) => {
                    const id = docSnap.id;
                    const p = docSnap.data();
                    const card = document.createElement('div');
                    card.className = "bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-2xl space-y-6";
                    
                    card.innerHTML = `
                        <!-- 1. 基本資料與長短休區 -->
                        <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 border-b border-slate-800 pb-4">
                            <div class="flex items-center gap-4">
                                <img src="${p.頭像 || p.avatar || 'https://via.placeholder.com/150'}" alt="頭像" class="w-16 h-16 rounded-full object-cover border-2 border-amber-500 shadow">
                                <div>
                                    <div class="text-xl font-bold text-amber-300">${p.姓名 || '未命名'} <span class="text-sm font-normal text-slate-400">(@${p.代號 || '-'})</span></div>
                                    <div class="text-sm text-slate-400 mt-1">
                                        性別: <span class="text-slate-200">${p.性別 || '-'}</span> | 
                                        年齡: <span class="text-slate-200">${p.年齡 || '-'}</span> | 
                                        種族: <span class="text-slate-200">${p.種族 || '-'}</span> | 
                                        職業: <span class="text-slate-200">${p.職業 || '-'}</span>
                                    </div>
                                </div>
                            </div>
                            <!-- 長短休與資產 -->
                            <div class="flex flex-wrap items-center gap-3">
                                <button onclick="window.shortRest('${id}')" class="bg-blue-600 hover:bg-blue-500 text-xs px-3 py-2 rounded-lg font-bold cursor-pointer">短休</button>
                                <button onclick="window.longRest('${id}')" class="bg-indigo-600 hover:bg-indigo-500 text-xs px-3 py-2 rounded-lg font-bold cursor-pointer">長休</button>
                                <div class="flex items-center gap-1 bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
                                    <span class="text-xs text-slate-400">資產:</span>
                                    <input type="number" value="${p.資產 ?? 0}" onchange="window.updateField('${id}', '資產', parseInt(this.value) || 0)" class="bg-slate-900 border border-slate-700 px-2 py-0.5 rounded w-24 text-yellow-400 font-bold text-sm">
                                    <span class="text-xs text-slate-400">元</span>
                                </div>
                            </div>
                        </div>

                        <!-- 2. 屬性數值與初始值調整區 -->
                        <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
                            <!-- 生命值 -->
                            <div class="bg-slate-800/60 p-3 rounded-xl border border-slate-700/60 space-y-2">
                                <div class="flex justify-between items-center text-xs">
                                    <span class="font-bold text-slate-300">生命值</span>
                                    <span class="text-slate-400">上限: <input type="number" value="${p.生命初始值 ?? 100}" onchange="window.updateField('${id}', '生命初始值', parseInt(this.value) || 0)" class="w-12 bg-slate-900 text-center rounded border border-slate-700 text-xs text-amber-300"></span>
                                </div>
                                <div class="text-2xl font-bold text-center text-red-400">${p.生命值 ?? 0}</div>
                                <div class="flex justify-center gap-1">
                                    <button onclick="window.adjustValue('${id}', '生命值', -5, p.生命值)" class="bg-slate-700 hover:bg-slate-600 px-1.5 py-0.5 rounded text-xs">-5</button>
                                    <button onclick="window.adjustValue('${id}', '生命值', -1, p.生命值)" class="bg-slate-700 hover:bg-slate-600 px-1.5 py-0.5 rounded text-xs">-1</button>
                                    <button onclick="window.adjustValue('${id}', '生命值', 1, p.生命值)" class="bg-slate-700 hover:bg-slate-600 px-1.5 py-0.5 rounded text-xs">+1</button>
                                    <button onclick="window.adjustValue('${id}', '生命值', 5, p.生命值)" class="bg-slate-700 hover:bg-slate-600 px-1.5 py-0.5 rounded text-xs">+5</button>
                                </div>
                            </div>

                            <!-- 修為 -->
                            <div class="bg-slate-800/60 p-3 rounded-xl border border-slate-700/60 space-y-2">
                                <div class="flex justify-between items-center text-xs">
                                    <span class="font-bold text-slate-300">修為</span>
                                    <span class="text-slate-400">上限: <input type="number" value="${p.修為初始值 ?? 50}" onchange="window.updateField('${id}', '修為初始值', parseInt(this.value) || 0)" class="w-12 bg-slate-900 text-center rounded border border-slate-700 text-xs text-amber-300"></span>
                                </div>
                                <div class="text-2xl font-bold text-center text-cyan-400">${p.修為 ?? 0}</div>
                                <div class="flex justify-center gap-1">
                                    <button onclick="window.adjustValue('${id}', '修為', -5, p.修為)" class="bg-slate-700 hover:bg-slate-600 px-1.5 py-0.5 rounded text-xs">-5</button>
                                    <button onclick="window.adjustValue('${id}', '修為', -1, p.修為)" class="bg-slate-700 hover:bg-slate-600 px-1.5 py-0.5 rounded text-xs">-1</button>
                                    <button onclick="window.adjustValue('${id}', '修為', 1, p.修為)" class="bg-slate-700 hover:bg-slate-600 px-1.5 py-0.5 rounded text-xs">+1</button>
                                    <button onclick="window.adjustValue('${id}', '修為', 5, p.修為)" class="bg-slate-700 hover:bg-slate-600 px-1.5 py-0.5 rounded text-xs">+5</button>
                                </div>
                            </div>

                            <!-- 速度 -->
                            <div class="bg-slate-800/60 p-3 rounded-xl border border-slate-700/60 space-y-2">
                                <div class="flex justify-between items-center text-xs">
                                    <span class="font-bold text-slate-300">速度</span>
                                    <span class="text-slate-400">初始: <input type="number" value="${p.速度初始值 ?? 10}" onchange="window.updateField('${id}', '速度初始值', parseInt(this.value) || 0)" class="w-12 bg-slate-900 text-center rounded border border-slate-700 text-xs text-amber-300"></span>
                                </div>
                                <div class="text-2xl font-bold text-center text-emerald-400">${p.速度 ?? 0}</div>
                                <div class="flex justify-center gap-1">
                                    <button onclick="window.adjustValue('${id}', '速度', -5, p.速度)" class="bg-slate-700 hover:bg-slate-600 px-1.5 py-0.5 rounded text-xs">-5</button>
                                    <button onclick="window.adjustValue('${id}', '速度', -1, p.速度)" class="bg-slate-700 hover:bg-slate-600 px-1.5 py-0.5 rounded text-xs">-1</button>
                                    <button onclick="window.adjustValue('${id}', '速度', 1, p.速度)" class="bg-slate-700 hover:bg-slate-600 px-1.5 py-0.5 rounded text-xs">+1</button>
                                    <button onclick="window.adjustValue('${id}', '速度', 5, p.速度)" class="bg-slate-700 hover:bg-slate-600 px-1.5 py-0.5 rounded text-xs">+5</button>
                                </div>
                            </div>

                            <!-- 攻擊 -->
                            <div class="bg-slate-800/60 p-3 rounded-xl border border-slate-700/60 space-y-2">
                                <div class="flex justify-between items-center text-xs">
                                    <span class="font-bold text-slate-300">攻擊</span>
                                    <span class="text-slate-400">初始: <input type="number" value="${p.攻擊初始值 ?? 10}" onchange="window.updateField('${id}', '攻擊初始值', parseInt(this.value) || 0)" class="w-12 bg-slate-900 text-center rounded border border-slate-700 text-xs text-amber-300"></span>
                                </div>
                                <div class="text-2xl font-bold text-center text-orange-400">${p.攻擊 ?? 0}</div>
                                <div class="flex justify-center gap-1">
                                    <button onclick="window.adjustValue('${id}', '攻擊', -1, p.攻擊)" class="bg-slate-700 hover:bg-slate-600 px-2 py-0.5 rounded text-xs">-1</button>
                                    <button onclick="window.adjustValue('${id}', '攻擊', 1, p.攻擊)" class="bg-slate-700 hover:bg-slate-600 px-2 py-0.5 rounded text-xs">+1</button>
                                </div>
                            </div>

                            <!-- 防禦 -->
                            <div class="bg-slate-800/60 p-3 rounded-xl border border-slate-700/60 space-y-2">
                                <div class="flex justify-between items-center text-xs">
                                    <span class="font-bold text-slate-300">防禦</span>
                                    <span class="text-slate-400">初始: <input type="number" value="${p.防禦初始值 ?? 10}" onchange="window.updateField('${id}', '防禦初始值', parseInt(this.value) || 0)" class="w-12 bg-slate-900 text-center rounded border border-slate-700 text-xs text-amber-300"></span>
                                </div>
                                <div class="text-2xl font-bold text-center text-blue-400">${p.防禦 ?? 0}</div>
                                <div class="flex justify-center gap-1">
                                    <button onclick="window.adjustValue('${id}', '防禦', -1, p.防禦)" class="bg-slate-700 hover:bg-slate-600 px-2 py-0.5 rounded text-xs">-1</button>
                                    <button onclick="window.adjustValue('${id}', '防禦', 1, p.防禦)" class="bg-slate-700 hover:bg-slate-600 px-2 py-0.5 rounded text-xs">+1</button>
                                </div>
                            </div>
                        </div>

                        <!-- 3. 消耗性道具區 -->
                        <div class="grid grid-cols-2 md:grid-cols-5 gap-3 bg-slate-950/40 p-4 rounded-xl border border-slate-800">
                            ${renderItemControl(id, '高效治療繃帶', p.高效治療繃帶)}
                            ${renderItemControl(id, '修為恢復藥劑', p.修為恢復藥劑)}
                            ${renderItemControl(id, '異常解除錠', p.異常解除錠)}
                            ${renderItemControl(id, '解咒符', p.解咒符)}
                            ${renderItemControl(id, '封魔匣', p.封魔匣)}
                        </div>

                        <!-- 4. 技能與裝備資訊 (僅顯示) -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs text-slate-300 bg-slate-950/60 p-4 rounded-xl border border-slate-800">
                            <div class="space-y-1.5">
                                <div class="font-bold text-amber-400 border-b border-slate-800 pb-1">技能配置</div>
                                <div>種族技能：<span class="text-white">${p['技能:種族'] || '-'}</span></div>
                                <div>職業技能：<span class="text-white">${p['技能:職業'] || '-'}</span></div>
                                <div>特殊技能：<span class="text-white">${p['技能:特殊'] || '-'}</span></div>
                                <div>技能 1 / 2：<span class="text-white">${p.技能1 || '-'} / ${p.技能2 || '-'}</span></div>
                                <div>裝備技能 1~3：<span class="text-white">${p.裝備技能1 || '-'}, ${p.裝備技能2 || '-'}, ${p.裝備技能3 || '-'}</span></div>
                            </div>
                            <div class="space-y-1.5">
                                <div class="font-bold text-amber-400 border-b border-slate-800 pb-1">裝備欄位</div>
                                <div class="grid grid-cols-2 gap-1">
                                    <div>主手：<span class="text-white">${p.裝備_主手 || '-'}</span></div>
                                    <div>副手：<span class="text-white">${p.裝備_副手 || '-'}</span></div>
                                    <div>頭部：<span class="text-white">${p.裝備_頭 || '-'}</span></div>
                                    <div>頸部：<span class="text-white">${p.裝備_頸 || '-'}</span></div>
                                    <div>身軀：<span class="text-white">${p.裝備_身 || '-'}</span></div>
                                    <div>手部：<span class="text-white">${p.裝備_手 || '-'}</span></div>
                                    <div>腰部：<span class="text-white">${p.裝備_腰 || '-'}</span></div>
                                    <div>腳部：<span class="text-white">${p.裝備_腳 || '-'}</span></div>
                                </div>
                            </div>
                        </div>

                        <!-- 5. 其餘道具區 (GM 與玩家可填寫增加物品與數量) -->
                        <div class="space-y-3 bg-slate-950/60 p-4 rounded-xl border border-slate-800">
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-xs text-amber-400">其餘道具清單</span>
                                <button onclick="window.addOtherItem('${id}', ${JSON.stringify(p.其餘道具 || [])})" class="bg-slate-800 hover:bg-slate-700 text-xs px-2 py-1 rounded border border-slate-700 cursor-pointer">＋ 新增道具</button>
                            </div>
                            <div class="space-y-2">
                                ${renderOtherItemsList(id, p.其餘道具 || [])}
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            });
        } catch (e) {
            console.error(e);
            container.innerHTML = `<div class="text-red-500 text-center py-10">初始化失敗：${e.message}</div>`;
        }

        // 輔助生成道具控制元件
        function renderItemControl(id, name, val) {
            const count = val ?? 0;
            return `
                <div class="bg-slate-800/40 p-2.5 rounded-lg border border-slate-700/50 flex flex-col items-center justify-between">
                    <span class="text-xs font-bold text-slate-300 mb-1 text-center">${name}</span>
                    <span class="text-xl font-bold text-amber-300 my-1">${count}</span>
                    <div class="flex gap-1">
                        <button onclick="window.adjustValue('${id}', '${name}', -1, ${count})" class="bg-slate-700 hover:bg-slate-600 px-2 py-0.5 rounded text-xs">-1</button>
                        <button onclick="window.adjustValue('${id}', '${name}', 1, ${count})" class="bg-slate-700 hover:bg-slate-600 px-2 py-0.5 rounded text-xs">+1</button>
                    </div>
                </div>
            `;
        }

        // 輔助生成其餘道具列表
        function renderOtherItemsList(id, items) {
            if (!items || items.length === 0) return '<div class="text-xs text-slate-500 text-center py-1">目前無其他道具</div>';
            return items.map((item, idx) => `
                <div class="flex items-center gap-2 bg-slate-900 p-2 rounded border border-slate-800 text-xs">
                    <input type="text" value="${item.name || ''}" onchange="window.updateOtherItem(${id}, ${idx}, this.value, ${item.qty || 1}, ${JSON.stringify(items)})" class="bg-slate-800 border border-slate-700 px-2 py-1 rounded flex-1 text-slate-200" placeholder="道具名稱">
                    <input type="number" value="${item.qty || 1}" onchange="window.updateOtherItem(${id}, ${idx}, '${item.name || ''}', parseInt(this.value) || 1, ${JSON.stringify(items)})" class="bg-slate-800 border border-slate-700 px-2 py-1 rounded w-16 text-center text-slate-200">
                    <button onclick="window.removeOtherItem(${id}, ${idx}, ${JSON.stringify(items)})" class="text-red-400 hover:text-red-300 px-2 py-1 font-bold">✕</button>
                </div>
            `).join('');
        }

        // 數值增減通用函式
        window.adjustValue = async function(playerId, field, delta, currentVal) {
            const newVal = Math.max(0, (currentVal ?? 0) + delta);
            await updateDoc(doc(db, "players", playerId), { [field]: newVal });
        };

        window.updateField = async function(playerId, field, val) {
            await updateDoc(doc(db, "players", playerId), { [field]: val });
        };

        // 短休邏輯：完全恢復生命、修為、速度、攻擊、防禦至初始值，但不修正溢出
        window.shortRest = async function(playerId) {
            const docRef = doc(db, "players", playerId);
            // 這裡可以透過快照或直接覆寫，簡化起見直接將目前數值設為對應初始值
            const snap = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js").then(m => m.getDoc(docRef));
            if (snap.exists()) {
                const d = snap.data();
                await updateDoc(docRef, {
                    生命值: d.生命初始值 ?? 100,
                    修為: d.修為初始值 ?? 50,
                    速度: d.速度初始值 ?? 10,
                    攻擊: d.攻擊初始值 ?? 10,
                    防禦: d.防禦初始值 ?? 10
                });
                alert("短休完畢：各項基本數值已恢復至初始值！");
            }
        };

        // 長休邏輯：完全恢復生命、修為、速度、攻擊、防禦至初始值，且溢出數值也修改（同短休效果或重置上限）
        window.longRest = async function(playerId) {
            await window.shortRest(playerId);
        };

        // 其餘道具增刪改
        window.addOtherItem = async function(playerId, currentItems) {
            const updated = [...currentItems, { name: "新道具", qty: 1 }];
            await updateDoc(doc(db, "players", playerId), { 其餘道具: updated });
        };

        window.updateOtherItem = async function(playerId, idx, name, qty, currentItems) {
            const updated = [...currentItems];
            updated[idx] = { name, qty };
            await updateDoc(doc(db, "players", playerId), { 其餘道具: updated });
        };

        window.removeOtherItem = async function(playerId, idx, currentItems) {
            const updated = currentItems.filter((_, i) => i !== idx);
            await updateDoc(doc(db, "players", playerId), { 其餘道具: updated });
        };

        // 建立新角色範本
        window.createNewPlayer = async function() {
            const newId = "player_" + Date.now();
            await setDoc(doc(db, "players", newId), {
                頭像: "https://via.placeholder.com/150",
                代號: "新代號",
                姓名: "新角色",
                性別: "不明",
                年齡: 18,
                種族: "人類",
                職業: "平民",
                生命值: 100,
                生命初始值: 100,
                修為: 50,
                修為初始值: 50,
                速度: 10,
                速度初始值: 10,
                攻擊: 10,
                攻擊初始值: 10,
                防禦: 10,
                防禦初始值: 10,
                資產: 1000,
                高效治療繃帶: 2,
                修為恢復藥劑: 1,
                異常解除錠: 1,
                解咒符: 1,
                封魔匣: 1,
                '技能:種族': '天生敏銳',
                '技能:職業': '基礎鍛鍊',
                '技能:特殊': '無',
                技能1: '普通攻擊',
                技能2: '防禦姿勢',
                裝備技能1: '無',
                裝備技能2: '無',
                裝備技能3: '無',
                裝備_主手: '木棍',
                裝備_副手: '無',
                裝備_頭: '布帽',
                裝備_頸: '無',
                裝備_身: '布衣',
                裝備_手: '無',
                裝備_腰: '無',
                裝備_腳: '草鞋',
                其餘道具: [{ name: "乾糧", qty: 3 }]
            });
            alert("新角色建立成功！");
        };
    </script>
</body>
</html>
