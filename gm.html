<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>GM 管理面板</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">
    <div class="max-w-7xl mx-auto space-y-6">
        <div class="flex justify-between items-center bg-slate-900 p-4 rounded-xl border border-slate-800">
            <h1 class="text-3xl font-bold text-amber-400">GM 遊戲管理面板</h1>
            <button onclick="createNewPlayer()" class="bg-amber-600 hover:bg-amber-500 px-4 py-2 rounded-lg font-bold">＋ 建立新角色</button>
        </div>

        <!-- 玩家列表容器 -->
        <div id="playersContainer" class="space-y-6">
            <div id="statusMsg" class="text-center py-10 text-slate-400">正在連線至 Firebase 讀取玩家資料...</div>
        </div>
    </div>

    <!-- Firebase 邏輯 -->
    <script type="module">
        import { db } from './firebase-config.js';
        import { ref, onValue, update, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const playersRef = ref(db, 'players');

        // 監聽 players 節點
        onValue(playersRef, (snapshot) => {
            const container = document.getElementById('playersContainer');
            
            if (!snapshot.exists()) {
                container.innerHTML = '<div class="text-center py-10 text-amber-500">資料庫中找不到 players 節點或目前沒有任何玩家資料，請點擊右上角「建立新角色」新增。</div>';
                return;
            }

            const data = snapshot.val();
            container.innerHTML = ''; // 清空狀態

            Object.entries(data).forEach(([id, p]) => {
                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl space-y-6";
                
                card.innerHTML = `
                    <!-- 頭部與基本資訊 -->
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-slate-800 pb-4">
                        <div class="flex items-center gap-4">
                            <img src="${p.avatar || 'https://via.placeholder.com/150'}" alt="頭像" class="w-16 h-16 rounded-full object-cover border border-amber-400">
                            <div>
                                <div class="text-xl font-bold text-amber-300">${p.name || '未命名'} <span class="text-sm text-slate-400">ID: ${id} (${p.code || '無代號'})</span></div>
                                <div class="text-sm text-slate-400">性別: ${p.gender || '-'} | 年齡: ${p.age || '-'} | 種族: ${p.race || '-'} | 職業: ${p.class || '-'}</div>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-sm text-slate-400">資產：</span>
                            <input type="number" value="${p.asset || 0}" onchange="updateField('${id}', 'asset', parseInt(this.value))" class="bg-slate-800 border border-slate-700 px-3 py-1 rounded w-32 text-yellow-400 font-bold">
                            <span class="text-slate-400">錢</span>
                        </div>
                    </div>

                    <!-- 數值調整區 (含現值與上限) -->
                    <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
                        <!-- 生命值 -->
                        <div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700/50">
                            <div class="text-sm font-bold mb-1 text-slate-300">生命值 (現/上限)</div>
                            <div class="flex items-center gap-1 mb-2">
                                <input type="number" value="${p.hp ?? 0}" onchange="updateField('${id}', 'hp', parseInt(this.value))" class="w-16 bg-slate-800 border border-slate-700 rounded px-2 py-1 text-center">
                                <span>/</span>
                                <input type="number" value="${p.hpMax ?? 0}" onchange="updateField('${id}', 'hpMax', parseInt(this.value))" class="w-16 bg-slate-800 border border-slate-700 rounded px-2 py-1 text-center text-slate-400">
                            </div>
                            <div class="flex gap-1 flex-wrap">
                                <button onclick="modifyVal('${id}', 'hp', -5, ${p.hpMax ?? 9999})" class="bg-red-600 px-2 py-0.5 rounded text-xs">-5</button>
                                <button onclick="modifyVal('${id}', 'hp', -1, ${p.hpMax ?? 9999})" class="bg-red-500 px-2 py-0.5 rounded text-xs">-1</button>
                                <button onclick="modifyVal('${id}', 'hp', 1, ${p.hpMax ?? 9999})" class="bg-green-500 px-2 py-0.5 rounded text-xs">+1</button>
                                <button onclick="modifyVal('${id}', 'hp', 5, ${p.hpMax ?? 9999})" class="bg-green-600 px-2 py-0.5 rounded text-xs">+5</button>
                            </div>
                        </div>
                        <!-- 修為 -->
                        <div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700/50">
                            <div class="text-sm font-bold mb-1 text-slate-300">修為 (現/上限)</div>
                            <div class="flex items-center gap-1 mb-2">
                                <input type="number" value="${p.mana ?? 0}" onchange="updateField('${id}', 'mana', parseInt(this.value))" class="w-16 bg-slate-800 border border-slate-700 rounded px-2 py-1 text-center">
                                <span>/</span>
                                <input type="number" value="${p.manaMax ?? 0}" onchange="updateField('${id}', 'manaMax', parseInt(this.value))" class="w-16 bg-slate-800 border border-slate-700 rounded px-2 py-1 text-center text-slate-400">
                            </div>
                            <div class="flex gap-1 flex-wrap">
                                <button onclick="modifyVal('${id}', 'mana', -5, ${p.manaMax ?? 9999})" class="bg-red-600 px-2 py-0.5 rounded text-xs">-5</button>
                                <button onclick="modifyVal('${id}', 'mana', -1, ${p.manaMax ?? 9999})" class="bg-red-500 px-2 py-0.5 rounded text-xs">-1</button>
                                <button onclick="modifyVal('${id}', 'mana', 1, ${p.manaMax ?? 9999})" class="bg-green-500 px-2 py-0.5 rounded text-xs">+1</button>
                                <button onclick="modifyVal('${id}', 'mana', 5, ${p.manaMax ?? 9999})" class="bg-green-600 px-2 py-0.5 rounded text-xs">+5</button>
                            </div>
                        </div>
                        <!-- 速度 -->
                        <div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700/50">
                            <div class="text-sm font-bold mb-1 text-slate-300">速度 (現/上限)</div>
                            <div class="flex items-center gap-1 mb-2">
                                <input type="number" value="${p.speed ?? 0}" onchange="updateField('${id}', 'speed', parseInt(this.value))" class="w-16 bg-slate-800 border border-slate-700 rounded px-2 py-1 text-center">
                                <span>/</span>
                                <input type="number" value="${p.speedMax ?? 0}" onchange="updateField('${id}', 'speedMax', parseInt(this.value))" class="w-16 bg-slate-800 border border-slate-700 rounded px-2 py-1 text-center text-slate-400">
                            </div>
                            <div class="flex gap-1 flex-wrap">
                                <button onclick="modifyVal('${id}', 'speed', -5, ${p.speedMax ?? 9999})" class="bg-red-600 px-2 py-0.5 rounded text-xs">-5</button>
                                <button onclick="modifyVal('${id}', 'speed', -1, ${p.speedMax ?? 9999})" class="bg-red-500 px-2 py-0.5 rounded text-xs">-1</button>
                                <button onclick="modifyVal('${id}', 'speed', 1, ${p.speedMax ?? 9999})" class="bg-green-500 px-2 py-0.5 rounded text-xs">+1</button>
                                <button onclick="modifyVal('${id}', 'speed', 5, ${p.speedMax ?? 9999})" class="bg-green-600 px-2 py-0.5 rounded text-xs">+5</button>
                            </div>
                        </div>
                        <!-- 攻擊 -->
                        <div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700/50">
                            <div class="text-sm font-bold mb-1 text-slate-300">攻擊 (現/上限)</div>
                            <div class="flex items-center gap-1 mb-2">
                                <input type="number" value="${p.atk ?? 0}" onchange="updateField('${id}', 'atk', parseInt(this.value))" class="w-16 bg-slate-800 border border-slate-700 rounded px-2 py-1 text-center">
                                <span>/</span>
                                <input type="number" value="${p.atkMax ?? 0}" onchange="updateField('${id}', 'atkMax', parseInt(this.value))" class="w-16 bg-slate-800 border border-slate-700 rounded px-2 py-1 text-center text-slate-400">
                            </div>
                            <div class="flex gap-1 flex-wrap">
                                <button onclick="modifyVal('${id}', 'atk', -1, ${p.atkMax ?? 9999})" class="bg-red-500 px-2 py-0.5 rounded text-xs">-1</button>
                                <button onclick="modifyVal('${id}', 'atk', 1, ${p.atkMax ?? 9999})" class="bg-green-500 px-2 py-0.5 rounded text-xs">+1</button>
                            </div>
                        </div>
                        <!-- 防禦 -->
                        <div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700/50">
                            <div class="text-sm font-bold mb-1 text-slate-300">防禦 (現/上限)</div>
                            <div class="flex items-center gap-1 mb-2">
                                <input type="number" value="${p.def ?? 0}" onchange="updateField('${id}', 'def', parseInt(this.value))" class="w-16 bg-slate-800 border border-slate-700 rounded px-2 py-1 text-center">
                                <span>/</span>
                                <input type="number" value="${p.defMax ?? 0}" onchange="updateField('${id}', 'defMax', parseInt(this.value))" class="w-16 bg-slate-800 border border-slate-700 rounded px-2 py-1 text-center text-slate-400">
                            </div>
                            <div class="flex gap-1 flex-wrap">
                                <button onclick="modifyVal('${id}', 'def', -1, ${p.defMax ?? 9999})" class="bg-red-500 px-2 py-0.5 rounded text-xs">-1</button>
                                <button onclick="modifyVal('${id}', 'def', 1, ${p.defMax ?? 9999})" class="bg-green-500 px-2 py-0.5 rounded text-xs">+1</button>
                            </div>
                        </div>
                    </div>

                    <!-- 特殊道具發放與管理 -->
                    <div class="bg-slate-800/50 p-4 rounded-lg border border-slate-700/50">
                        <div class="font-bold mb-2 text-amber-300">特殊道具發放與管理</div>
                        <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
                            ${renderItemControl(id, '高效治療繃帶', 'bandage', p.items?.bandage)}
                            ${renderItemControl(id, '修為恢復藥劑', 'manaPotion', p.items?.manaPotion)}
                            ${renderItemControl(id, '異常解除錠', 'curePill', p.items?.curePill)}
                            ${renderItemControl(id, '解咒符', 'dispelTalisman', p.items?.dispelTalisman)}
                            ${renderItemControl(id, '封魔匣', 'sealBox', p.items?.sealBox)}
                        </div>
                    </div>

                    <!-- 技能、裝備與其餘道具資訊 -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs bg-slate-800/30 p-4 rounded-lg">
                        <div>
                            <span class="font-bold text-slate-300 block mb-1">技能資訊：</span>
                            <div>種族: ${p.skills?.race || '-'}</div>
                            <div>職業: ${p.skills?.class || '-'}</div>
                            <div>特殊: ${p.skills?.special || '-'}</div>
                            <div>技能1: ${p.skills?.s1 || '-'}</div>
                            <div>技能2: ${p.skills?.s2 || '-'}</div>
                            <div>裝備技能1: ${p.skills?.eq1 || '-'}</div>
                            <div>裝備技能2: ${p.skills?.eq2 || '-'}</div>
                            <div>裝備技能3: ${p.skills?.eq3 || '-'}</div>
                        </div>
                        <div>
                            <span class="font-bold text-slate-300 block mb-1">裝備資訊：</span>
                            <div>主手: ${p.equips?.main || '-'}</div>
                            <div>副手: ${p.equips?.off || '-'}</div>
                            <div>頭: ${p.equips?.head || '-'}</div>
                            <div>頸: ${p.equips?.neck || '-'}</div>
                            <div>身: ${p.equips?.body || '-'}</div>
                            <div>手: ${p.equips?.hand || '-'}</div>
                            <div>腰: ${p.equips?.waist || '-'}</div>
                            <div>腳: ${p.equips?.foot || '-'}</div>
                        </div>
                        <div>
                            <span class="font-bold text-slate-300 block mb-1">其餘道具背包：</span>
                            <div class="space-y-1 mb-2">
                                ${renderOtherItems(id, p.otherItems)}
                            </div>
                            <div class="flex gap-1">
                                <input type="text" id="gm_item_${id}" placeholder="新增道具" class="bg-slate-800 border border-slate-700 px-2 py-1 rounded flex-1">
                                <button onclick="gmAddOtherItem('${id}')" class="bg-cyan-600 px-2 py-1 rounded">發</button>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }, (error) => {
            console.error("Firebase 讀取錯誤:", error);
            document.getElementById('playersContainer').innerHTML = `<div class="text-center py-10 text-red-500">讀取失敗，請檢查 F12 主控台與 Firebase 權限設定。<br>錯誤訊息：${error.message}</div>`;
        });

        // 渲染道具控制元件
        function renderItemControl(playerId, label, key, count = 0) {
            return `
                <div class="bg-slate-900 p-2 rounded text-center border border-slate-800">
                    <div class="text-slate-400 text-xs">${label}</div>
                    <div class="text-lg font-bold my-1">${count}</div>
                    <div class="flex gap-1 justify-center">
                        <button onclick="updateItem('${playerId}', '${key}', -1)" class="bg-red-600 px-2 py-0.5 rounded text-xs">-1</button>
                        <button onclick="updateItem('${playerId}', '${key}', 1)" class="bg-amber-600 px-2 py-0.5 rounded text-xs">+發放</button>
                    </div>
                </div>
            `;
        }

        // 渲染其餘道具列表
        function renderOtherItems(playerId, otherItems) {
            if (!otherItems) return '<span class="text-slate-500">無其他道具</span>';
            return Object.entries(otherItems).map(([name, qty]) => `
                <div class="flex justify-between items-center bg-slate-900 px-2 py-1 rounded">
                    <span>${name} (${qty})</span>
                    <button onclick="gmUpdateOtherItem('${playerId}', '${name}', -1)" class="text-red-400 hover:text-red-300">[-]</button>
                </div>
            `).join('');
        }

        // 數值增減
        window.modifyVal = function(playerId, field, amount, maxVal) {
            const playerRef = ref(db, 'players/' + playerId);
            onValue(playerRef, (snapshot) => {
                const p = snapshot.val();
                let current = p[field] ?? 0;
                let newVal = current + amount;
                if (newVal < 0) newVal = 0;
                if (newVal > maxVal) newVal = maxVal;
                update(ref(db, 'players/' + playerId), { [field]: newVal });
            }, { onlyOnce: true });
        }

        // 直接更新欄位
        window.updateField = function(playerId, field, value) {
            update(ref(db, 'players/' + playerId), { [field]: value });
        }

        // 更新特殊道具
        window.updateItem = function(playerId, itemKey, amount) {
            const playerRef = ref(db, 'players/' + playerId + '/items/' + itemKey);
            onValue(playerRef, (snapshot) => {
                let current = snapshot.val() || 0;
                let newVal = current + amount;
                if (newVal < 0) newVal = 0;
                update(ref(db, 'players/' + playerId + '/items'), { [itemKey]: newVal });
            }, { onlyOnce: true });
        }

        // GM 新增其餘道具給玩家
        window.gmAddOtherItem = function(playerId) {
            const input = document.getElementById('gm_item_' + playerId);
            const name = input.value.trim();
            if (!name) return;

            const playerRef = ref(db, 'players/' + playerId);
            onValue(playerRef, (snapshot) => {
                const data = snapshot.val();
                let otherItems = data.otherItems || {};
                otherItems[name] = (otherItems[name] || 0) + 1;
                update(ref(db, 'players/' + playerId), { otherItems });
            }, { onlyOnce: true });
            input.value = '';
        }

        // GM 減少其餘道具
        window.gmUpdateOtherItem = function(playerId, name, amount) {
            const playerRef = ref(db, 'players/' + playerId);
            onValue(playerRef, (snapshot) => {
                const data = snapshot.val();
                let otherItems = data.otherItems || {};
                if (otherItems[name]) {
                    otherItems[name] += amount;
                    if (otherItems[name] <= 0) delete otherItems[name];
                    update(ref(db, 'players/' + playerId), { otherItems });
                }
            }, { onlyOnce: true });
        }

        // 建立新角色 (使用 player 開頭的自訂 ID，呼應您的玩家端)
        window.createNewPlayer = function() {
            const customId = "player" + Math.floor(Math.random() * 900 + 100);
            const newPlayerRef = ref(db, 'players/' + customId);
            set(newPlayerRef, {
                code: "P001",
                name: "新冒險者",
                gender: "男",
                age: 20,
                race: "人族",
                class: "劍士",
                avatar: "https://via.placeholder.com/150",
                asset: 100,
                hp: 100, hpMax: 100,
                mana: 50, manaMax: 50,
                speed: 10, speedMax: 10,
                atk: 15, atkMax: 15,
                def: 10, defMax: 10,
                items: { bandage: 2, manaPotion: 1, curePill: 1, dispelTalisman: 0, sealBox: 0 },
                skills: { race: "被動-強壯", class: "連斬", special: "無", s1: "重擊", s2: "護身", eq1: "裝備技A", eq2: "", eq3: "" },
                equips: { main: "鐵劍", off: "無", head: "皮帽", neck: "無", body: "皮甲", hand: "無", waist: "無", foot: "皮靴" },
                otherItems: { "木材": 3 }
            }).then(() => {
                alert(`成功建立新角色！其 ID 為：${customId}，可在玩家端網址加上 ?id=${customId} 檢視。`);
            });
        }
    </script>
</body>
</html>
