<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRPG GM 控制台</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; max-width: 900px; margin: auto; }
        .global-panel { background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #334155; display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
        .card { background: #1e293b; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #334155; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
        label { font-size: 0.8rem; color: #94a3b8; display: block; }
        input { width: 100%; padding: 6px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 4px; box-sizing: border-box; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 8px 12px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0ea5e9; }
        .btn-green { background: #34d399; }
        .btn-green:hover { background: #10b981; }
        h3 { margin-top: 0; color: #38bdf8; }
    </style>
</head>
<body>

    <h1>👑 TRPG GM 遊戲管理控制台</h1>

    <!-- GM 全域功能面板 -->
    <div class="global-panel">
        <div>
            <label>GM 全域操作</label>
            <button class="btn-green" id="rest-all-btn">⛺ 全員休息回復 (保留溢出)</button>
        </div>
        <div>
            <label>批次增加全員道具數量</label>
            <div style="display: flex; gap: 5px; margin-top: 5px;">
                <select id="batch-item-select" style="background:#0f172a; color:#fff; border:1px solid #475569; padding:4px; border-radius:4px;">
                    <option value="繃帶">繃帶</option>
                    <option value="修為恢復藥劑">修為恢復藥劑</option>
                    <option value="異常解錠">異常解錠</option>
                    <option value="解咒符">解咒符</option>
                    <option value="封魔匣">封魔匣</option>
                </select>
                <input type="number" id="batch-item-qty" value="1" style="width: 60px;">
                <button id="batch-add-btn">發放</button>
            </div>
        </div>
    </div>

    <div id="players-container">載入玩家列表中...</div>

    <script type="module">
        import { db, collection, onSnapshot, doc, updateDoc, getDocs } from "./firebase-config.js";

        const container = document.getElementById("players-container");
        const colRef = collection(db, "players");

        // 即時監聽所有玩家
        onSnapshot(colRef, (snapshot) => {
            container.innerHTML = "";
            if (snapshot.empty) {
                container.innerHTML = "<p>目前沒有找到任何玩家資料。</p>";
                return;
            }

            snapshot.forEach((documentSnap) => {
                const playerId = documentSnap.id;
                const data = documentSnap.data();

                const card = document.createElement("div");
                card.className = "card";
                
                let html = `<h3>${data.姓名 || '未命名'} (${playerId}) - 種族: ${data.種族 || ''} / 職業: ${data.職業 || ''}</h3>`;
                
                // 資產與調整
                html += `<div style="margin-bottom:10px; background:#0f172a; padding:10px; border-radius:6px; display:flex; justify-content:space-between; align-items:center;">
                    <span>💰 現有資產: <strong>${data.資產 || 0}</strong></span>
                    <div style="display:flex; gap:5px;">
                        <input type="number" id="asset-input-${playerId}" placeholder="輸入金額" style="width:100px;">
                        <button onclick="updateAsset('${playerId}')">修改資產</button>
                    </div>
                </div>`;

                html += `<div class="grid">`;
                
                // 屬性與上限
                const fields = [
                    { cur: "生命值", max: "生命初始值" },
                    { cur: "修為", max: "修為初始值" },
                    { cur: "速度", max: "速度初始值" },
                    { cur: "攻擊", max: "攻擊初始值" },
                    { cur: "防禦", max: "防禦初始值" }
                ];

                fields.forEach(f => {
                    html += `
                        <div style="background:#0f172a; padding:8px; border-radius:4px;">
                            <label>${f.cur}</label>
                            <input type="number" id="gm-${playerId}-${f.cur}" value="${data[f.cur] !== undefined ? data[f.cur] : 0}">
                            <label style="margin-top:4px; color:#facc15;">上限/初始 (${f.max})</label>
                            <input type="number" id="gm-${playerId}-${f.max}" value="${data[f.max] !== undefined ? data[f.max] : 0}">
                        </div>
                    `;
                });

                // 常用道具 (對應 Firebase 實際欄位: 繃帶、修為恢復藥劑、異常解錠、解咒符、封魔匣)
                const items = ["繃帶", "修為恢復藥劑", "異常解錠", "解咒符", "封魔匣"];
                items.forEach(item => {
                    html += `
                        <div style="background:#0f172a; padding:8px; border-radius:4px;">
                            <label>${item}</label>
                            <input type="number" id="gm-${playerId}-${item}" value="${data[item] !== undefined ? data[item] : 0}">
                        </div>
                    `;
                });

                html += `</div>`;
                html += `<button class="btn-green" style="margin-top:10px; width:100%;" onclick="savePlayer('${playerId}')">💾 儲存該玩家所有數值與上限</button>`;
                
                card.innerHTML = html;
                container.appendChild(card);
            });
        });

        // 單一玩家儲存
        window.savePlayer = async (playerId) => {
            const fields = ["生命值", "生命初始值", "修為", "修為初始值", "速度", "速度初始值", "攻擊", "攻擊初始值", "防禦", "防禦初始值", "繃帶", "修為恢復藥劑", "異常解錠", "解咒符", "封魔匣"];
            const updateData = {};
            fields.forEach(f => {
                const el = document.getElementById(`gm-${playerId}-${f}`);
                if (el) updateData[f] = Number(el.value);
            });

            try {
                await updateDoc(doc(db, "players", playerId), updateData);
                alert(`玩家 ${playerId} 資料已成功更新！`);
            } catch (e) {
                console.error(e);
                alert("更新失敗");
            }
        };

        // GM 調整資產
        window.updateAsset = async (playerId) => {
            const inputVal = document.getElementById(`asset-input-${playerId}`).value;
            if (inputVal === "") return;
            const newAsset = Number(inputVal);
            try {
                await updateDoc(doc(db, "players", playerId), { 資產: newAsset });
                alert("資產更新成功！");
            } catch(e) {
                console.error(e);
                alert("資產更新失敗");
            }
        };

        // GM 全員休息回復
        document.getElementById("rest-all-btn").addEventListener("click", async () => {
            if (!confirm("確定要讓全體玩家休息嗎？這會將生命與修為回補至初始值，但保留溢出數值。")) return;
            
            const querySnapshot = await getDocs(colRef);
            const updates = [];

            querySnapshot.forEach((documentSnap) => {
                const data = documentSnap.data();
                const pId = documentSnap.id;
                
                const currentHP = data["生命值"] || 0;
                const maxHP = data["生命初始值"] || 0;
                const currentMP = data["修為"] || 0;
                const maxMP = data["修為初始值"] || 0;

                const newHP = Math.max(currentHP, maxHP);
                const newMP = Math.max(currentMP, maxMP);

                const docRefTarget = doc(db, "players", pId);
                updates.push(updateDoc(docRefTarget, { "生命值": newHP, "修為": newMP }));
            });

            await Promise.all(updates);
            alert("全員休息完畢！狀態已回補（溢出數值已完美保留）。");
        });

        // 批次發放常用道具給所有人
        document.getElementById("batch-add-btn").addEventListener("click", async () => {
            const itemName = document.getElementById("batch-item-select").value;
            const addQty = Number(document.getElementById("batch-item-qty").value) || 0;
            if (addQty <= 0) return;

            if (!confirm(`確定要幫所有人增加 ${addQty} 個 [${itemName}] 嗎？`)) return;

            const querySnapshot = await getDocs(colRef);
            const updates = [];

            querySnapshot.forEach((documentSnap) => {
                const data = documentSnap.data();
                const pId = documentSnap.id;
                const currentCount = data[itemName] || 0;

                const docRefTarget = doc(db, "players", pId);
                updates.push(updateDoc(docRefTarget, { [itemName]: currentCount + addQty }));
            });

            await Promise.all(updates);
            alert("批次發放道具成功！");
        });
    </script>
</body>
</html>
