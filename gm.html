<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>GM 遊戲管理面板 (Firestore)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">
    <div class="max-w-7xl mx-auto space-y-6">
        <div class="flex justify-between items-center bg-slate-900 p-4 rounded-xl border border-slate-800">
            <h1 class="text-3xl font-bold text-amber-400">GM 遊戲管理面板 (Firestore)</h1>
            <button onclick="createNewPlayer()" class="bg-amber-600 hover:bg-amber-500 px-4 py-2 rounded-lg font-bold">＋ 建立新角色</button>
        </div>

        <!-- 玩家列表容器 -->
        <div id="playersContainer" class="space-y-6">
            <div id="statusMsg" class="text-center py-10 text-slate-400">正在連線至 Firestore 讀取玩家資料...</div>
        </div>
    </div>

    <!-- Firebase Firestore 邏輯 -->
    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, onSnapshot, doc, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // 即時監聽 players 集合
        onSnapshot(collection(db, "players"), (snapshot) => {
            const container = document.getElementById('playersContainer');
            
            if (snapshot.empty) {
                container.innerHTML = '<div class="text-center py-10 text-amber-500">目前沒有任何玩家資料。</div>';
                return;
            }

            container.innerHTML = '';

            snapshot.forEach((docSnap) => {
                const id = docSnap.id;
                const p = docSnap.data();
                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl space-y-6";
                
                card.innerHTML = `
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-slate-800 pb-4">
                        <div class="flex items-center gap-4">
                            <img src="${p.avatar || 'https://via.placeholder.com/150'}" alt="頭像" class="w-16 h-16 rounded-full object-cover border border-amber-400">
                            <div>
                                <div class="text-xl font-bold text-amber-300">${p.姓名 || p.name || '未命名'} <span class="text-sm text-slate-400">ID: ${id}</span></div>
                                <div class="text-sm text-slate-400">性別: ${p.性別 || '-'} | 年齡: ${p.年齡 || '-'} | 代號: ${p.代號 || '-'}</div>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-sm text-slate-400">資產：</span>
                            <input type="number" value="${p.asset || 0}" onchange="updateField('${id}', 'asset', parseInt(this.value))" class="bg-slate-800 border border-slate-700 px-3 py-1 rounded w-32 text-yellow-400 font-bold">
                            <span class="text-slate-400">錢</span>
                        </div>
                    </div>

                    <!-- 數值調整區 -->
                    <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
                        <!-- 生命值 -->
                        <div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700/50">
                            <div class="text-sm font-bold mb-1 text-slate-300">生命值 (現/上限)</div>
                            <div class="flex items-center gap-1 mb-2">
                                <input type="number" value="${p.hp ?? 0}" onchange="updateField('${id}', 'hp', parseInt(this.value))" class="w-16 bg-slate-800 border border-slate-700 rounded px-2 py-1 text-center">
                                <span>/</span>
                                <input type="number" value="${p.hpMax ?? 0}" onchange="updateField('${id}', 'hpMax', parseInt(this.value))" class="w-16 bg-slate-800 border border-slate-700 rounded px-2 py-1 text-center text-slate-400">
                            </div>
                        </div>
                        <!-- 修為 -->
                        <div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700/50">
                            <div class="text-sm font-bold mb-1 text-slate-300">修為 (現/初始)</div>
                            <div class="flex items-center gap-1 mb-2">
                                <input type="number" value="${p.修為 ?? 0}" onchange="updateField('${id}', '修為', parseInt(this.value))" class="w-16 bg-slate-800 border border-slate-700 rounded px-2 py-1 text-center">
                                <span>/</span>
                                <input type="number" value="${p.修為初始值 ?? 0}" onchange="updateField('${id}', '修為初始值', parseInt(this.value))" class="w-16 bg-slate-800 border border-slate-700 rounded px-2 py-1 text-center text-slate-400">
                            </div>
                        </div>
                        <!-- 封魔匣 -->
                        <div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700/50">
                            <div class="text-sm font-bold mb-1 text-slate-300">封魔匣</div>
                            <div class="flex items-center gap-1 mb-2">
                                <input type="number" value="${p.封魔匣 ?? 0}" onchange="updateField('${id}', '封魔匣', parseInt(this.value))" class="w-20 bg-slate-800 border border-slate-700 rounded px-2 py-1 text-center">
                            </div>
                        </div>
                        <!-- 修為恢復藥劑 -->
                        <div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700/50">
                            <div class="text-sm font-bold mb-1 text-slate-300">修為恢復藥劑</div>
                            <div class="flex items-center gap-1 mb-2">
                                <input type="number" value="${p['修為恢復藥劑'] ?? 0}" onchange="updateField('${id}', '修為恢復藥劑', parseInt(this.value))" class="w-20 bg-slate-800 border border-slate-700 rounded px-2 py-1 text-center">
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }, (error) => {
            console.error("Firestore 讀取錯誤:", error);
            document.getElementById('playersContainer').innerHTML = `<div class="text-center py-10 text-red-500">讀取失敗：${error.message}，請檢查 Firestore 規則權限。</div>`;
        });

        window.updateField = async function(playerId, field, value) {
            try {
                await updateDoc(doc(db, "players", playerId), { [field]: value });
                console.log(`更新成功: ${playerId} -> ${field} = ${value}`);
            } catch (e) {
                console.error("更新失敗:", e);
                alert("更新失敗，請檢查權限或控制台。");
            }
        }

        window.createNewPlayer = async function() {
            const newId = "player03";
            try {
                await setDoc(doc(db, "players", newId), {
                    id: newId,
                    姓名: "新玩家",
                    代號: "小新",
                    性別: "男",
                    年齡: 20,
                    修為: 10,
                    修為初始值: 10,
                    修為恢復藥劑: 2,
                    封魔匣: 1,
                    asset: 10000,
                    hp: 20,
                    hpMax: 20
                });
                alert("新角色建立成功！");
            } catch (e) {
                console.error("建立失敗:", e);
                alert("建立失敗：" + e.message);
            }
        }
    </script>
</body>
</html>
